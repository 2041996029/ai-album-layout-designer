name: Deploy album preview to GitHub Pages
on:
  push:
    branches: [feat/album-development]
    paths:
      - 'apps/web/**'
      - 'apps/admin/**'
      - 'packages/**'
      - 'docs/release-v1.0/contracts/schemas/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: album-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npm run build:admin
      - name: Assemble C4 preview
        run: |
          mkdir -p apps/web/dist/admin
          cp -R apps/admin/dist/. apps/web/dist/admin/
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; writeFileSync("apps/web/dist/deployment.json", JSON.stringify({stage:"C4",commit:process.env.GITHUB_SHA,builtAt:new Date().toISOString()}))'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          name: album-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: album-pages-${{ github.run_id }}-${{ github.run_attempt }}

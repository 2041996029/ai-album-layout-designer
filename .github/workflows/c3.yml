name: C3 identity assets and cross-device
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: c3_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-disposable
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      C3_TEST_DATABASE_URL: postgresql://postgres:local-ci-disposable@127.0.0.1:5432/c3_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tools/api-codegen
      - run: npm run api:types:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img"><title>P13 · 配置中心与云存储根目录</title><desc>原创静态原型 · 配置未接入；草稿、连接测试、发布与历史对象读取分别管理。</desc><style>text{font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif} .muted{fill:#6C7772}</style><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F5F4EF"/><text x="32" y="39" font-size="22" fill="#203B35" font-weight="700">P13 · 配置中心与云存储根目录</text><text x="32" y="66" font-size="13" fill="#6C7772" font-weight="400">原创静态原型 · 配置未接入；草稿、连接测试、发布与历史对象读取分别管理。</text><rect x="24" y="86" width="1392" height="58" rx="10" fill="#FFFFFF"/><text x="45" y="123" font-size="20" fill="#26614E" font-weight="700">拾光相册 · 管理后台</text><rect x="1060" y="104" width="130" height="25" rx="12" fill="#E6EEE6"/><text x="1070" y="121" font-size="11" fill="#26614E" font-weight="600">预发环境 · 示例</text><text x="1220" y="123" font-size="14" fill="#203B35" font-weight="400">配置管理员</text><rect x="24" y="160" width="220" height="790" rx="10" fill="#FFFFFF"/><text x="52" y="200" font-size="14" fill="#6C7772" font-weight="400">配置概览</text><rect x="36" y="229" width="196" height="38" rx="6" fill="#E6EEE6"/><text x="52" y="254" font-size="14" fill="#26614E" font-weight="600">云存储</text><text x="52" y="308" font-size="14" fill="#6C7772" font-weight="400">AI 服务与模型</text><text x="52" y="362" font-size="14" fill="#6C7772" font-weight="400">登录与通知</text><text x="52" y="416" font-size="14" fill="#6C7772" font-weight="400">支付与商品</text><text x="52" y="470" font-size="14" fill="#6C7772" font-weight="400">导出与队列</text><text x="52" y="524" font-size="14" fill="#6C7772" font-weight="400">备份与告警</text><text x="52" y="578" font-size="14" fill="#6C7772" font-weight="400">变更记录</text><text x="46" y="917" font-size="12" fill="#6C7772" font-weight="400">所有连接均为设计状态</text><text x="270" y="199" font-size="25" fill="#203B35" font-weight="700">云存储配置</text><rect x="1060" y="180" width="126" height="25" rx="12" fill="#FBF0DB"/><text x="1070" y="197" font-size="11" fill="#8D6423" font-weight="600">草稿 · 未校验</text><rect x="1204" y="175" width="187" height="38" rx="7" fill="#FFFFFF" stroke="#DCE2DB"/><text x="1218" y="200" font-size="13" fill="#203B35" font-weight="600">查看变更历史</text><rect x="270" y="225" width="1120" height="70" rx="8" fill="#E9EEE7"/><text x="289" y="251" font-size="16" fill="#26614E" font-weight="600">当前没有已发布的存储配置</text><text x="289" y="276" font-size="13" fill="#6C7772" font-weight="400">选择适配器、填写连接和根前缀，测试通过后再发布。旧资源始终按原位置读取。</text><rect x="270" y="313" width="740" height="478" rx="10" fill="#FFFFFF"/><text x="290" y="347" font-size="19" fill="#203B35" font-weight="700">连接与写入目录</text><text x="290" y="379" font-size="12" fill="#6C7772" font-weight="400">供应商适配器</text><rect x="290" y="392" width="324" height="38" rx="6" fill="#F5F4EF" stroke="#DCE2DB"/><text x="302" y="417" font-size="13" fill="#203B35" font-weight="400">请选择已实现的适配器</text><text x="646" y="379" font-size="12" fill="#6C7772" font-weight="400">区域 / Region</text><rect x="646" y="392" width="342" height="38" rx="6" fill="#F5F4EF" stroke="#DCE2DB"/><text x="658" y="417" font-size="13" fill="#203B35" font-weight="400">尚未设置</text><text x="290" y="464" font-size="12" fill="#6C7772" font-weight="400">Bucket</text><rect x="290" y="477" width="324" height="38" rx="6" fill="#F5F4EF" stroke="#DCE2DB"/><text x="302" y="502" font-size="13" fill="#203B35" font-weight="400">尚未设置</text><text x="646" y="464" font-size="12" fill="#6C7772" font-weight="400">凭据</text><rect x="646" y="477" width="342" height="38" rx="6" fill="#F5F4EF" stroke="#DCE2DB"/><text x="658" y="502" font-size="13" fill="#203B35" font-weight="400">选择秘密引用 · 明文不回显</text><text x="290" y="549" font-size="12" fill="#6C7772" font-weight="400">Endpoint</text><rect x="290" y="562" width="698" height="38" rx="6" fill="#F5F4EF" stroke="#DCE2DB"/><text x="302" y="587" font-size="13" fill="#203B35" font-weight="400">https:// 受批准的存储服务地址</text><text x="290" y="634" font-size="12" fill="#6C7772" font-weight="400">自定义根前缀 / basePrefix</text><rect x="290" y="647" width="698" height="38" rx="6" fill="#F5F4EF" stroke="#DCE2DB"/><text x="302" y="672" font-size="13" fill="#203B35" font-weight="400">album/staging</text><text x="290" y="736" font-size="13" fill="#6C7772" font-weight="400">私有桶：开启并锁定      下载凭据：300 秒      环境：预发</text><rect x="1030" y="313" width="360" height="478" rx="10" fill="#FFFFFF"/><text x="1050" y="347" font-size="19" fill="#203B35" font-weight="700">目录预览</text><text x="1050" y="392" font-size="14" fill="#203B35" font-weight="400">album/staging/</text><text x="1050" y="426" font-size="14" fill="#203B35" font-weight="400">  ws_demo/</text><text x="1050" y="460" font-size="14" fill="#203B35" font-weight="400">    original/2026/10/</text><text x="1050" y="494" font-size="14" fill="#203B35" font-weight="400">      ast_demo/hash.jpg</text><rect x="1049" y="554" width="320" height="118" rx="9" fill="#E9EEE7"/><text x="1063" y="579" font-size="13" fill="#26614E" font-weight="700">此变更影响新写入</text><text x="1063" y="603" font-size="12" fill="#6C7772" font-weight="400">不自动迁移历史照片。</text><text x="1063" y="625" font-size="12" fill="#6C7772" font-weight="400">用户文件夹名不会写进对象 key。</text><text x="1063" y="647" font-size="12" fill="#6C7772" font-weight="400">历史迁移需单独估算和校验。</text><text x="1050" y="720" font-size="13" fill="#6C7772" font-weight="400">连接测试尚未执行</text><text x="1050" y="751" font-size="12" fill="#6C7772" font-weight="400">测试会在临时前缀写、读、删。</text><rect x="270" y="810" width="1120" height="140" rx="10" fill="#FFFFFF"/><text x="290" y="842" font-size="17" fill="#203B35" font-weight="700">发布前检查</text><text x="290" y="875" font-size="13" fill="#6C7772" font-weight="400">权限、路径、私有访问、写读删测试与版本依赖全部通过后才能发布。</text><rect x="290" y="896" width="155" height="38" rx="7" fill="#FFFFFF" stroke="#DCE2DB"/><text x="304" y="921" font-size="13" fill="#203B35" font-weight="600">保存草稿</text><rect x="461" y="896" width="183" height="38" rx="7" fill="#FFFFFF" stroke="#DCE2DB"/><text x="475" 
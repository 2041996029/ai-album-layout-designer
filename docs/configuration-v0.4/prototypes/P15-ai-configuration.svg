<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img"><title>P15 · AI 服务、模型与预算配置</title><desc>原创静态原型 · 示例连接未启用；认证检查与真实样图测试分开，报价和已接受任务使用不可变版本。</desc><style>text{font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif} .muted{fill:#6C7772}</style><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F5F4EF"/><text x="32" y="39" font-size="22" fill="#203B35" font-weight="700">P15 · AI 服务、模型与预算配置</text><text x="32" y="66" font-size="13" fill="#6C7772" font-weight="400">原创静态原型 · 示例连接未启用；认证检查与真实样图测试分开，报价和已接受任务使用不可变版本。</text><rect x="24" y="86" width="1392" height="58" rx="10" fill="#FFFFFF"/><text x="45" y="123" font-size="20" fill="#26614E" font-weight="700">拾光相册 · 管理后台</text><rect x="1060" y="104" width="130" height="25" rx="12" fill="#E6EEE6"/><text x="1070" y="121" font-size="11" fill="#26614E" font-weight="600">预发环境 · 示例</text><text x="1220" y="123" font-size="14" fill="#203B35" font-weight="400">配置管理员</text><rect x="24" y="160" width="220" height="790" rx="10" fill="#FFFFFF"/><text x="52" y="200" font-size="14" fill="#6C7772" font-weight="400">配置概览</text><text x="52" y="254" font-size="14" fill="#6C7772" font-weight="400">云存储</text><rect x="36" y="283" width="196" height="38" rx="6" fill="#E6EEE6"/><text x="52" y="308" font-size="14" fill="#26614E" font-weight="600">AI 服务与模型</text><text x="52" y="362" font-size="14" fill="#6C7772" font-weight="400">登录与通知</text><text x="52" y="416" font-size="14" fill="#6C7772" font-weight="400">支付与商品</text><text x="52" y="470" font-size="14" fill="#6C7772" font-weight="400">导出与队列</text><text x="52" y="524" font-size="14" fill="#6C7772" font-weight="400">备份与告警</text><text x="52" y="578" font-size="14" fill="#6C7772" font-weight="400">变更记录</text><text x="46" y="917" font-size="12" fill="#6C7772" font-weight="400">所有连接均为设计状态</text><text x="270" y="199" font-size="25" fill="#203B35" font-weight="700">AI 服务与模型</text><rect x="1090" y="180" width="115" height="25" rx="12" fill="#FBF0DB"/><text x="1100" y="197" font-size="11" fill="#8D6423" font-weight="600">未验证</text><rect x="1220" y="175" width="170" height="38" rx="7" fill="#FFFFFF" stroke="#DCE2DB"/><text x="1234" y="200" font-size="13" fill="#203B35" font-weight="600">测试记录</text><rect x="270" y="226" width="1120" height="62" rx="10" fill="#FFFFFF"/><text x="289" y="262" font-size="15" fill="#203B35" font-weight="600">连接   |   模型   |   默认路由   |   风格预设   |   报价规则   |   用量与费用</text><rect x="270" y="307" width="730" height="506" rx="10" fill="#FFFFFF"/><text x="290" y="343" font-size="19" fill="#203B35" font-weight="700">连接草稿</text><text x="290" y="377" font-size="12" fill="#6C7772" font-weight="400">适配器</text><rect x="290" y="390" width="315" height="38" rx="6" fill="#F5F4EF" stroke="#DCE2DB"/><text x="302" y="415" font-size="13" fill="#203B35" font-weight="400">请选择已实现的供应商适配器</text><text x="637" y="377" font-size="12" fill="#6C7772" font-weight="400">凭据</text><rect x="637" y="390" width="342" height="38" rx="6" fill="#F5F4EF" stroke="#DCE2DB"/><text x="649" y="415" font-size="13" fill="#203B35" font-weight="400">选择秘密引用 · 明文不回显</text><text x="290" y="462" font-size="12" fill="#6C7772" font-weight="400">API 服务地址</text><rect x="290" y="475" width="689" height="38" rx="6" fill="#F5F4EF" stroke="#DCE2DB"/><text x="302" y="500" font-size="13" fill="#203B35" font-weight="400">https:// 受批准的供应商地址</text><text x="290" y="547" font-size="12" fill="#6C7772" font-weight="400">模型 ID / 版本</text><rect x="290" y="560" width="315" height="38" rx="6" fill="#F5F4EF" stroke="#DCE2DB"/><text x="302" y="585" font-size="13" fill="#203B35" font-weight="400">按供应商契约登记</text><text x="637" y="547" font-size="12" fill="#6C7772" font-weight="400">支持能力</text><rect x="637" y="560" width="342" height="38" rx="6" fill="#F5F4EF" stroke="#DCE2DB"/><text x="649" y="585" font-size="13" fill="#203B35" font-weight="400">待契约测试：文生图 / 参考图</text><text x="290" y="632" font-size="12" fill="#6C7772" font-weight="400">每日预算（人民币分）</text><rect x="290" y="645" width="315" height="38" rx="6" fill="#F5F4EF" stroke="#DCE2DB"/><text x="302" y="670" font-size="13" fill="#203B35" font-weight="400">尚未设置 · 0 表示停接新付费任务</text><text x="637" y="632" font-size="12" fill="#6C7772" font-weight="400">并发 / 限流</text><rect x="637" y="645" width="342" height="38" rx="6" fill="#F5F4EF" stroke="#DCE2DB"/><text x="649" y="670" font-size="13" fill="#203B35" font-weight="400">按账户、模型与工作区共同限制</text><text x="290" y="739" font-size="13" fill="#6C7772" font-weight="400">未支持的参数不会显示给用户；模型默认值只影响新报价。</text><rect x="290" y="762" width="183" height="38" rx="7" fill="#FFFFFF" stroke="#DCE2DB"/><text x="304" y="787" font-size="13" fill="#203B35" font-weight="600">保存草稿</text><rect x="490" y="762" width="189" height="38" rx="7" fill="#FFFFFF" stroke="#DCE2DB"/><text x="504" y="787" font-size="13" fill="#203B35" font-weight="600">网络 / 认证检查</text><rect x="1020" y="307" width="370" height="506" rx="10" fill="#FFFFFF"/><text x="1040" y="343" font-size="18" fill="#203B35" font-weight="700">默认路由与生效范围</text><text x="1040" y="386" font-size="12" fill="#6C7772" font-weight="400">规则排版</text><text x="1040" y="414" font-size="14" fill="#203B35" font-weight="400">本地规则 · 不消耗生图点数</text><text x="1040" y="462" font-size="12" fill="#6C7772" font-weight="400">文生图默认模型</text><text x="1040" y="490" font-size="14" fill="#203B35" font-weight="400">尚未配置</text><text x="1040" y="538" font-size="12" fill="#6C7772" font-weight="400">参考图彩绘模型</text><text x="1040" y="566" font-size="14" fill="#203B35" font-weight="400">尚未配置</text><text x="1040" y="614" font-size="12" fill="#6C7772" font-weight="400">审核与来源标识</text><text x="1040" y="642" font-size="14" fill="#203B35" font-weight="400">待策略和契约验证</text><rect x="1040" y="694" width="330" height="96" rx="9" fill="#E9EEE7"/><text x="1054" y="719" font-size="13" fill="#26614E" font-weight="700">已有任务保持原版本</text><text x="1054" y="743" font-size="12" fill="#6C7772" font-weight="400">不会换模型或重新报价。</text><text x="1054" y="765" font-size="12" fill="#6C7772" font-weight="400">状态未知先查询，不重复付费提交。</text><rect x="270" y="831" width="1120" height="117" rx="9" fill="#E9EEE7"/><text x="290" y="862" font-size="17" fill="#26614E" font-weight="700">真实样图测试会产生供应商费用</text><text x="290" y="892" font-size="13" fill="#6C7772" font-weight="400">先取得并确认预计成本，使用平台测试预算；不会扣客户点数。</text><text x="290" y="922" font-size="12" fill="#6C7772" font-weight="400">本原型尚未接入供应商，没有测试费用或成功结果。</text><rect x="1160" y="879" width="210" height="38" rx="7" fill="#FFFFFF" stroke="#DCE2DB"/><text x="1174" y="904" font-size="13" fill="#203B35" font-weight="600">获取测试费用报价</text></svg>
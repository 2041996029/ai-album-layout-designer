<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img"><title>P10 · 排版候选与照片完整性</title><desc>把“全部使用”落实到每张照片的分配结果；无效候选无法应用。数量和结果为原型演示。</desc><style>text{font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif} .muted{fill:#6C7772}</style><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F5F4EF"/><text x="32" y="39" font-size="22" fill="#203B35" font-weight="700">P10 · 排版候选与照片完整性</text><text x="32" y="66" font-size="13" fill="#6C7772" font-weight="400">把“全部使用”落实到每张照片的分配结果；无效候选无法应用。数量和结果为原型演示。</text><rect x="24" y="86" width="1392" height="64" rx="12" fill="#FFFFFF"/><text x="44" y="126" font-size="20" fill="#26614E" font-weight="700">拾光相册</text><text x="240" y="125" font-size="14" fill="#26614E" font-weight="600">我的相册</text><text x="390" y="125" font-size="14" fill="#6C7772" font-weight="400">模板中心</text><text x="540" y="125" font-size="14" fill="#6C7772" font-weight="400">AI 水墨彩绘</text><text x="690" y="125" font-size="14" fill="#6C7772" font-weight="400">任务中心</text><rect x="1160" y="105" width="88" height="25" rx="12" fill="#E6EEE6"/><text x="1170" y="122" font-size="11" fill="#26614E" font-weight="600">个人工作区</text><text x="1270" y="125" font-size="13" fill="#203B35" font-weight="400">账号与会员</text><rect x="40" y="175" width="330" height="760" rx="10" fill="#FFFFFF"/><text x="62" y="216" font-size="22" fill="#203B35" font-weight="700">排版约束</text><text x="62" y="260" font-size="12" fill="#6C7772" font-weight="400">输入照片</text><rect x="60" y="270" width="286" height="39" rx="6" fill="#F5F4EF"/><text x="74" y="296" font-size="14" fill="#203B35" font-weight="400">12 张 · 全部使用</text><text x="62" y="333" font-size="12" fill="#6C7772" font-weight="400">照片重复</text><rect x="60" y="343" width="286" height="39" rx="6" fill="#F5F4EF"/><text x="74" y="369" font-size="14" fill="#203B35" font-weight="400">不允许</text><text x="62" y="406" font-size="12" fill="#6C7772" font-weight="400">相册内页</text><rect x="60" y="416" width="286" heigh
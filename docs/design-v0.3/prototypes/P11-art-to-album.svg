<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img"><title>P11 · 艺术素材进入可编辑相册</title><desc>生成图与标题分别保存；修改客户姓名、日期或页码，不需要再次生图。原创效果示意。</desc><style>text{font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif} .muted{fill:#6C7772}</style><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F5F4EF"/><text x="32" y="39" font-size="22" fill="#203B35" font-weight="700">P11 · 艺术素材进入可编辑相册</text><text x="32" y="66" font-size="13" fill="#6C7772" font-weight="400">生成图与标题分别保存；修改客户姓名、日期或页码，不需要再次生图。原创效果示意。</text><rect x="24" y="86" width="1392" height="64" rx="12" fill="#FFFFFF"/><text x="44" y="126" font-size="20" fill="#26614E" font-weight="700">拾光相册</text><text x="240" y="125" font-size="14" fill="#6C7772" font-weight="400">我的相册</text><text x="390" y="125" font-size="14" fill="#6C7772" font-weight="400">模板中心</text><text x="540" y="125" font-size="14" fill="#26614E" font-weight="600">AI 水墨彩绘</text><text x="690" y="125" font-size="14" fill="#6C7772" font-weight="400">任务中心</text><rect x="1160" y="105" width="88" height="25" rx="12" fill="#E6EEE6"/><text x="1170" y="122" font-size="11" fill="#26614E" font-weight="600">个人工作区</text><text x="1270" y="125" font-size="13" fill="#203B35" font-weight="400">账号与会员</text><rect x="40" y="175" width="360" height="760" rx="10" fill="#FFFFFF"/><text x="62" y="215" font-size="24" fill="#203B35" font-weight="700">AI 水墨彩绘</text><text x="62" y="261" font-size="13" fill="#6C7772" font-weight="400">风格预设</text><rect x="62" y="279" width="145" height="25" rx="12" fill="#E6EEE6"/><text x="72" y="296" font-size="11" fill="#26614E" font-weight="600">山水淡墨</text><rect x="220" y="279" width="145" height="25" rx="12" fill="#F5F4EF"/><text x="230" y="296" font-size="11" fill="#26614E" font-weight="600">人像淡彩</text><text x="62" y="343" font-size="14" fill="#203B35" font-weight="600">创作描述</text><rect x="62" y="360" width="316" height="105" rx="6" fill="#F5F4EF"/><text x="76" y="391" font-size="14" fill="#203B35" font-weight="400">旅行封面的山川与水面，</text><text x="76" y="418" font-size="14" fill="#203B35" font-weight="400">淡墨留白，安静的远方。</text><text x="62" y="510" font-size="14" fill="#203B35" font-weight="600">参考照片（可选）</text><rect x="62" y="528" width="316" height="77" rx="6" fill="#F5F4EF" stroke="#DCE2DB"/><text x="96" y="573" font-size="14" fill="#26614E" font-weight="400">＋ 选择参考照片</text><text x="62" y="642" font-size="13" fill="#203B35" font-weight="400">□ 我了解参考图的处理用途</text><text x="62" y="672" font-size="12" fill="#6C7772" font-weight="400">生成可能改变人物、场景和细节。</text><rect x="62" y="699" width="316" height="38" rx="7" fill="#26614E"/><text x="76" y="724" font-size="13" fill="#FFFFFF" font-weight="600">获取本次点数报价</text><text x="62" y="760" font-size="13" fill="#6C7772" font-weight="400">确认报价后才创建生成任务。</text><rect x="62" y="798" width="316" height="96" rx="9" fill="#E9EEE7"/><text x="76" y="823" font-size="13" fill="#26614E" font-weight="700">不覆盖原片</text><text x="76" y="847" font-size="12" fill="#6C7772" font-weight="400">生成失败与取消按任务规则结算。</text><text x="76" y="869" font-size="12" fill="#6C7772" font-weight="400">结果可在任务中心找回。</text><rect x="424" y="175" width="974" height="486" rx="10" fill="#FFFFFF"/><text x="446" y="216" font-size="21" fill="#203B35" font-weight="700">结果预览 · 素材层</text><rect x="446" y="238" width="930" height="330" rx="5" fill="#EAE7DB"/><path d="M446 520 Q650 255 860 500 Q1110 250 1376 525 L1376 568 L446 568Z" fill="#9EB4A3" opacity=".65"/><path d="M446 548 Q920 488 1376 548" fill="none" stroke="#59775F" stroke-width="3"/><text x="468" y="269" font-size="13" fill="#6C7772" font-weight="400">艺术效果示意</text><text x="468" y="550" font-size="13" fill="#203B35" font-weight="400">AI 生成标识区域</text><rect x="446" y="593" width="190" height="38" rx="7" fill="#FFFFFF" stroke="#DCE2DB"/><text x="460" y="618" font-size="13" fill="#203B35" font-weight="600">加入我的素材</text><rect x="654" y="593" width="220" height="38" rx="7" fill="#26614E"/><text x="668" y="618" font-size="13" fill="#FFFFF
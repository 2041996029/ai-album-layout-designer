<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img"><title>P09 · 选择创作方式</title><desc>同一工作区，两条创作路径；照片素材和可编辑相册始终分开保存。原创静态原型。</desc><style>text{font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif} .muted{fill:#6C7772}</style><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F5F4EF"/><text x="32" y="39" font-size="22" fill="#203B35" font-weight="700">P09 · 选择创作方式</text><text x="32" y="66" font-size="13" fill="#6C7772" font-weight="400">同一工作区，两条创作路径；照片素材和可编辑相册始终分开保存。原创静态原型。</text><rect x="24" y="86" width="1392" height="64" rx="12" fill="#FFFFFF"/><text x="44" y="126" font-size="20" fill="#26614E" font-weight="700">拾光相册</text><text x="240" y="125" font-size="14" fill="#26614E" font-weight="600">我的相册</text><text x="390" y="125" font-size="14" fill="#6C7772" font-weight="400">模板中心</text><text x="540" y="125" font-size="14" fill="#6C7772" font-weight="400">AI 水墨彩绘</text><text x="690" y="125" font-size="14" fill="#6C7772" font-weight="400">任务中心</text><rect x="1160" y="105" width="88" height="25" rx="12" fill="#E6EEE6"/><text x="1170" y="122" font-size="11" fill="#26614E" font-weight="600">个人工作区</text><text x="1270" y="125" font-size="13" fill="#203B35" font-weight="400">账号与会员</text><text x="50" y="211" font-size="30" fill="#203B35" font-weight="700">这一次，你想怎样留下照片？</text><text x="50" y="248" font-size="15" fill="#6C7772" font-weight="400">先明确创作目标，再进入合适的工具。</text><rect x="50" y="283" width="650" height="555" rx="10" fill="#FFFFFF"/><text x="75" y="331" font-size="27" fill="#203B35" font-weight="700">照片忠实排版</text><text x="75" y="368" font-size="16" fill="#6C7772" font-weight="400">用已有照片，组成可编辑的相册。</text><rect x="75" y="389" width="190" height="25" rx="12" fill="#E6EEE6"/><text x="85" y="406" font-size="11" fill="#26614E" font-weight="600">保留照片内容</text><rect x="740" y="283" width="650" height="555" rx="10" fill="#FFFFFF"/><text x="765" y="331" font-size="27" fill="#203B35" font-weight="700">AI 艺术创作</text><text x="765" y="368" font-size="16" fill="#6C7772" font-weight="400">把灵感变成一张新的艺术素材。</text><rect x="765" y="389" width="190" height="25" rx="12" fill="#E6EEE6"/><text x="775" y="406" font-size="11" fill="#26614E" font-weight="600">可能改变画面细节</text><rect x="75" y="447" width="600" height="240" rx="2" fill="#FFFEFA" stroke="#DCE2DB"/><line x1="375.0" y1="447" x2="375.0" y2="687" stroke="#D8D4C8"/><rect x="99.0" y="471.0" width="252.0" height="156.0" rx="4" fill="#C9D8CC"/><path d="M101.0 625.0 L187.2 533.4 L255.24 583.3199999999999 L300.6 549.0 L349.0 625.0 Z" fill="#A7BFAF"/><circle cx="288.0" cy="510.0" r="12.48" fill="#F5EEE0"/><text x="109.0" y="615.0" font-size="11" fill="#203B35" font-weight="400">照片 01</text><rect x="399.0" y="471.0" width="252.0" height="156.0" rx="4" fill="#C9D8CC"/><path d="M401.0 625.0 L487.2 533.4 L555.24 583.3199999999999 L600.6 549.0 L649.0 625.0 Z" fill="#A7BFAF"/><circle cx="588.0" cy="510.0" r="12.48" fill="#F5EEE0"/><text x="409.0" y="615.0" font-size="11" fill="#203B35" font-weight="400">照片 02</text><text x="129.0" y="658.2" font-size="12.0" fill="#203B35" font-weight="400">我们的旅行</text><text x="75" y="725" font-size="16" fill="#203B35" font-weight="600">照片、标题、页码分别可编辑</text><text x="75" y="756" font-size="14" fill="#6C7772" font-weight="400">自动排版不生成新人物／场景，不覆盖原片。</text><rect x="75" y="779" width="600" height="38" rx="7" fill="#26614E"/><text x="89" y="804" font-size="13" fill="#FFFFFF" font-weight="600">从照片开始排版</text><rect x="765" y="447" width="600" height="240" rx="5" fill="#EAE7DB"/><path d="M765 655 Q890 440 1040 615 Q1180 455 1365 650 L1365 687 L765 687Z" fill="#9EB4A3" opacity=".65"/><path d="M765 675 Q1000 610 1365 675" fill="none" stroke="#59775F" stroke-width="3"/><text x="790" y="479" font-size="13" fill="#6C7772" font-weight="400">原创艺术效果示意</text><text x="790" y="662" font-size="13" fill="#203B35" font-weight="400">AI 生成标识区域</text><text x="765" y="725" font-size="16" fill="#203B35" font-weight="600">生成结果作为图片素材加入相册</text><text x="765" y="756" font-size="14" fill="#6C7772" font-weight="400">相册文字独立编辑；生成前确认用途与点数。</text><rect x="765" y="779" width="600" height="38" rx="7" fill="#FFFFFF" stroke="#DCE2DB"/><text x="779" y="804" font-size="13" fill="#203B35" font-weight="600">开始艺术创作</text><rect x="50" y="862" width="1340" height="96" rx="9" fill="#E9EEE7"/><text x="64" y="887" font-size="13" fill="#26614E" font-weight="700">多端继续，同一份作品</text><text x="64" y="911" font-size="12" fill="#6C7772" font-weight="400">网页完整图层编辑；小程序上传、快速成册、替换文字、调整裁剪与预览。</text><text x="64" y="933" font-size="12" fill="#6C7772" font-weight="400">从艺术创作返回相册时，新建图片图层，保留原片、标题与已保存版本。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img"><title>P12 · 导出预检 · 阻断与警告</title><desc>原片失效不能静默回退缩略图；预检绑定保存版本与导出参数。示例状态为“需要修复”。</desc><style>text{font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif} .muted{fill:#6C7772}</style><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F5F4EF"/><text x="32" y="39" font-size="22" fill="#203B35" font-weight="700">P12 · 导出预检 · 阻断与警告</text><text x="32" y="66" font-size="13" fill="#6C7772" font-weight="400">原片失效不能静默回退缩略图；预检绑定保存版本与导出参数。示例状态为“需要修复”。</text><rect x="24" y="86" width="1392" height="64" rx="12" fill="#FFFFFF"/><text x="44" y="126" font-size="20" fill="#26614E" font-weight="700">拾光相册</text><text x="240" y="125" font-size="14" fill="#6C7772" font-weight="400">我的相册</text><text x="390" y="125" font-size="14" fill="#6C7772" font-weight="400">模板中心</text><text x="540" y="125" font-size="14" fill="#6C7772" font-weight="400">AI 水墨彩绘</text><text x="690" y="125" font-size="14" fill="#26614E" font-weight="600">任务中心</text><rect x="1160" y="105" width="88" height="25" rx="12" fill="#E6EEE6"/><text x="1170" y="122" font-size="11" fill="#26614E" font-weight="600">个人工作区</text><text x="1270" y="125" font-size="13" fill="#203B35" font-weight="400">账号与会员</text><rect x="40" y="175" width="380" height="760" rx="10" fill="#FFFFFF"/><text x="62" y="216" font-size="24" fill="#203B35" font-weight="700">本次导出</text><text x="62" y="260" font-size="12" fill="#6C7772" font-weight="400">作品快照</text><rect x="60" y="272" width="336" height="38" rx="6" fill="#F5F4EF"/><text x="75" y="297" font-size="14" fill="#203B35" font-weight="400">山海之间 · 版本 12</text><text x="62" y="335" font-size="12" fill="#6C7772" font-weight="400">范围与视图</text><rect x="60" y="347" width="336" height="38" rx="6" fill="#F5F4EF"/><text x="75" y="372" font-size="14" fill="#203B35" font-weight="400">全部 10 跨页 · 封面独立</text><text x="62" y="410" font-size="12" fill="#6C7772" font-weight="400">格式</text><rect x="60" y="422" width="336" height="38" rx="6" fill="#F5F4EF"/><text x="75" y="447" font-size="14" fill="#203B35" font-weight="400">高清 PNG＋普通 PDF</text><text x="62" y="485" font-size="12" fill="#6C7772" font-weight="400">裁切尺寸</text><rect x="60" y="497" width="336" height="38" rx="6" fill="#F5F4EF"/><text x="75" y="522" font-size="14" fill="#203B35" font-weight="400">600 × 300 mm</text><text x="62" y="560" font-size="12" fill="#6C7772" font-weight="400">分辨率与出血</text><rect x="60" y="572" width="336" height="38" rx="6" fill="#F5F4EF"/><text x="75" y="597" font-size="14" fill="#203B35" font-weight="400">300 DPI · 四边 3 mm</text><text x="62" y="635" font-size="12" fill="#6C7772" font-weight="400">实际输出像素</text><rect x="60" y="647" width="336" height="38" rx="6" fill="#F5F4EF"/><text x="75" y="672" font-size="14" fill="#203B35" font-weight="400">约 7157 × 3614 px</text><rect x="62" y="747" width="336" height="118" rx="9" fill="#E9EEE7"/><text x="76" y="772" font-size="13" fill="#26614E" font-weight="700">文字与清晰度</text><text x="76" y="796" font-size="12" fill="#6C7772" font-weight="400">标题、姓名和页码来自可编辑文字层。</text><text x="76" y="818" font-size="12" fill="#6C7772" font-weight="400">DPI 标签不能提升低清原图的细节。</text><text x="76" y="840" font-size="12" fill="#6C7772" font-weight="400">缺图／缺字体／超框文字需先修复。</text><text x="448" y="216" font-size="24" fill="#203B35" font-weight="700">预检未通过</text><rect x="1180" y="195" width="192" height="25" rx="12" fill="#FAE5DD"/><text x="1190" y="212" font-size="11" fill="#A9573D" font-weight="600">2 项阻断 · 2 项警告</text><rect x="448" y="241" width="948" height="116" rx="8" fill="#FFFFFF"/><rect x="463" y="254" width="62" height="25" rx="12" fill="#FAE5DD"/><text x="473" y="271" font-size="11" fill="#A9573D" font-weight="600">阻断</text><text x="541" y="274" font-size="16" fill="#203B35" font-weight="600">照片 07 原片不可用</text><text x="464" y="314" font-size="13" fill="#6C7772" font-weight="400">预览缩略图仍在，但不能用于高清导出。</text><rect x="1190" y="303" width="186" height="38" rx="7" fill="#FFFFFF" stroke="#DCE2DB"/><text x="1204" y="328" font-size="13" fill="#203B35" font-weight="600">重新上传</text><rect x="448" y="373" width="948" height="116" rx="8" fill="#FFFFFF"/><rect x="463" y="386" width="62" height="25" rx="12" fill="#FAE5DD"/><text x="473" y="403" font-size="11" fill="#A9573D" font-weight="600">阻断</text><text x="541" y="406" font-size="16" fill="#203B35" font-weight="600">第 5 跨页标题超出文本框</text><text x="464" y="446" font-size="13" fill="#6C7772" font-weight="400">客户姓名存在被裁掉的风险。</text><rect x="1190" y="435" width="186" height="38" rx="7" fill="#FFFFFF" stroke="#DCE2DB"/><text x="1204" y="460" font-size="13" fill="#203B35" font-weight="600">定位文字</text><rect x="448" y="505" width="948" height="116" rx="8" fill="#FFFFFF"/><rect x="463" y="518" width="62" height="25" rx="12" fill="#FBF0DB"/><text x="473" y="535" font-size="11" fill="#8D6423" font-weight="600">警告</text><text x="541" y="538" font-size="16" fill="#203B35" font-weight="600">照片 03 清晰度偏低</text><text x="464" y="578" font-size="13" fill="#6C7772" font-weight="400">裁剪后约 156 PPI，可替换原片或确认继续。</text><rect x="1190" y="567" width="186" height="38" rx="7" fill="#FFFFFF" stroke="#DCE2DB"/><text x="1204" y="592" font-size="13" fill="#203B35" font-weight="600">定位照片</text><rect x="448" y="637" width="948" height="116" rx="8" fill="#FFFFFF"/><rect x="463" y="650" width="62" height="25" rx="12" fill="#FBF0DB"/><text x="473" y="667" font-size="11" fill="#8D6423" font-weight="600">警告</text><text x="541" y="670" font-size="16" fill="#203B35" font-weight="600">第 6 跨页文字靠近中缝</text><text x="464" y="710" font-size="13" fill="#6C7772" font-weight="400">建议将文字移出安全区。</text><rect x="1190" y="699" width="186" height="38" rx="7" fill="#FFFFFF" stroke="#DCE2DB"/><text x="1204" y="724" font-size="13" fill="#203B35" font-weight="600">定位跨页</text><text x="448" y="811" font-size="14" fill="#6C7772" font-weight="400">□ 我了解剩余清晰度与安全区警告，确认继续。</text><rect x="448" y="842" width="225" height="38" rx="7" fill="#FFFFFF" stroke="#DCE2DB"/><text x="462" y="867" font-size="13" fill="#203B35" font-weight="600">修复后重新预检</text><rect x="696" y="842" width="700" height="38" rx="7" fill="#E1E5DE"/><text x="711" y="868" font-size="14" fill="#6C7772" font-weight="600">修复阻断项并确认警告后，才能加入导出队列</text><text x="448" y="917" font-size="13" fill="#6C7772" font-weight="400">导出提交后继续编辑，不改变本次已接受的作品快照。</text></svg>
# Integration design template for future application images; no services are started by validation.
name: album-integration
services:
  postgres:
    image: ${POSTGRES_IMAGE:?set tested postgres image}
    environment:
      POSTGRES_DB: album
      POSTGRES_USER: album
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
    - postgres_password
    volumes:
    - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U album -d album
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
    - backend
  redis:
    image: ${REDIS_IMAGE:?set tested redis image}
    command:
    - redis-server
    - --appendonly
    - 'yes'
    volumes:
    - redisdata:/data
    networks:
    - backend
  api:
    image: ${API_IMAGE:?build and set API_IMAGE}
    environment:
      APP_ENV: ${APP_ENV:-dev}
      SERVICE_ROLE: api
      SESSION_SIGNING_SECRET_FILE: /run/secrets/session_signing
      HTTP_PORT: '3000'
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set origin}
      PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN:?set API origin}
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      SECRET_STORE_PROVIDER: ${SECRET_STORE_PROVIDER:-localFiles}
      SECRET_STORE_CATALOG_FILE: /run/secrets/catalog.json
      CONFIG_REFRESH_SECONDS: '30'
      CONFIG_MAX_STALENESS_SECONDS: '300'
      LOG_REDACTION: strict
      RELEASE_ID: ${RELEASE_ID:?set release}
      COMMIT_SHA: ${COMMIT_SHA:?set actual commit}
    secrets:
    - database_url
    - redis_url
    - session_signing
    - catalog
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
    - 127.0.0.1:3000:3000
    networks:
    - backend
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3000/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 3
  export-worker:
    image: ${WORKER_IMAGE:?build and set WORKER_IMAGE}
    environment:
      APP_ENV: ${APP_ENV:-dev}
      SERVICE_ROLE: export-worker
      HTTP_PORT: '3000'
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set origin}
      PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN:?set API origin}
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      SECRET_STORE_PROVIDER: ${SECRET_STORE_PROVIDER:-localFiles}
      SECRET_STORE_CATALOG_FILE: /run/secrets/catalog.json
      CONFIG_REFRESH_SECONDS: '30'
      CONFIG_MAX_STALENESS_SECONDS: '300'
      LOG_REDACTION: strict
      RELEASE_ID: ${RELEASE_ID:?set release}
      COMMIT_SHA: ${COMMIT_SHA:?set actual commit}
      WORKER_MEMORY_MIB: ${WORKER_MEMORY_MIB:-2048}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      RENDER_BROWSER_REVISION: ${RENDER_BROWSER_REVISION:?pin render browser revision}
    secrets:
    - database_url
    - redis_url
    - catalog
    depends_on:
    - api
    mem_limit: 3g
    networks:
    - backend
  ai-worker:
    image: ${WORKER_IMAGE:?build and set WORKER_IMAGE}
    environment:
      APP_ENV: ${APP_ENV:-dev}
      SERVICE_ROLE: ai-worker
      HTTP_PORT: '3000'
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set origin}
      PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN:?set API origin}
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      SECRET_STORE_PROVIDER: ${SECRET_STORE_PROVIDER:-localFiles}
      SECRET_STORE_CATALOG_FILE: /run/secrets/catalog.json
      CONFIG_REFRESH_SECONDS: '30'
      CONFIG_MAX_STALENESS_SECONDS: '300'
      LOG_REDACTION: strict
      RELEASE_ID: ${RELEASE_ID:?set release}
      COMMIT_SHA: ${COMMIT_SHA:?set actual commit}
      WORKER_MEMORY_MIB: '1024'
      WORKER_CONCURRENCY: '1'
    secrets:
    - database_url
    - redis_url
    - catalog
    depends_on:
    - api
    mem_limit: 1536m
    networks:
    - backend
  web:
    image: ${WEB_IMAGE:?build and set WEB_IMAGE}
    ports:
    - 127.0.0.1:8080:80
    depends_on:
    - api
    networks:
    - backend
  admin:
    image: ${ADMIN_IMAGE:?build and set ADMIN_IMAGE}
    ports:
    - 127.0.0.1:8081:80
    depends_on:
    - api
    networks:
    - backend
secrets:
  database_url:
    file: ${DATABASE_URL_SECRET_PATH:?set mounted secret file}
  redis_url:
    file: ${REDIS_URL_SECRET_PATH:?set mounted secret file}
  session_signing:
    file: ${SESSION_SECRET_PATH:?set mounted secret file}
  catalog:
    file: ${SECRET_CATALOG_PATH:?set mounted secret catalog}
  postgres_password:
    file: ${POSTGRES_PASSWORD_PATH:?set mounted postgres password}
volumes:
  pgdata: {}
  redisdata: {}
networks:
  backend: {}

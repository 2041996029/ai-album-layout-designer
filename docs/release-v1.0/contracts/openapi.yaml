              schema:
                type: string
                minLength: 1
                maxLength: 128
                examples:
                - prj_demo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginWechatMiniResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MiniLogin'
      x-idempotency-scope: workspace resolved from target or request; otherwise authenticated user or pre-auth browser
        challenge
  /auth/sms/challenges:
    post:
      operationId: createSmsChallenge
      tags:
      - Identity
      summary: 发起短信验证
      description: 发起短信验证.
      x-module: C3
      x-requirement-ids:
      - AUTH-01
      - CFG-AUTH
      - SEC-01
      x-required-permission: public

    TemplateSlot:
      type: object
      properties:
        slotId:
          type: string
          minLength: 1
          maxLength: 128
          examples:
          - prj_demo
        spreadId:
          type: string
          minLength: 1
          maxLength: 128
          examples:
          - prj_demo
        layerId:
          type: string
          minLength: 1
          maxLength: 128
          examples:
          - prj_demo
        kind:
          type: string
          enum:
          - image
          - text
        miniEditableFields:
          type: array
          items:
            type: string
            enum:
            - text
            - crop
            - assetId
          minItems: 0
          maxItems: 3
          uniqueItems: true
        bindingRequired:
          type: boolean
          description: true for required image placeholders that must receive a workspace asset during project instantiation.
            Text slots use false.
        placeholderAssetId:
          $ref: '#/components/schemas/Id'
          description: Registered immutable platform placeholder asset, never a synthetic client ID or arbitrary
            URL. Must equal assetId on the bound document image layer when bindingRequired=true.
      required:
      - slotId
      - spreadId
      - layerId
      - kind
      - miniEditableFields
      - bindingRequired
      additionalProperties: false
      allOf:
      - if:
          properties:
            kind:
              const: image
          required:
          - kind
        then:
          properties:
            miniEditableFields:
              items:
                enum:
                - crop
                - assetId
      - if:
          properties:
            kind:
              const: text
          required:
          - kind
        then:
          properties:
            bindingRequired:
              const: false
            placeholderAssetId: false
            miniEditableFields:
              items:
                const: text
      - if:
          properties:
            bindingRequired:
              const: true
          required:
          - bindingRequired
        then:
          required:
          - placeholderAssetId
          properties:
            kind:
              const: image
      description: Immutable binding by spreadId/layerId, recursively resolving within the referenced spread. slotId
        and (spreadId,layerId) must each be unique. kind must equal actual image/text layer.type; groups/opaque/shape
        layers are not editable slots. image placeholders use actual registered platform asset bytes and bindingRequired=true;
        project creation replaces every required placeholder with an authorized workspace image or fails TEMPLATE_BINDING_REQUIRED.
        Text mini fields must be subset of document text.editableFields; no URL/seed-design/frame-only placeholder
        is publishable.

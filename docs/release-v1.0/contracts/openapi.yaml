openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: AI Album 全模块研发 API 合同
  version: 1.0.0-design
  description: 设计合同，非服务已实现证明。所有 ID 示例为演示值，金额与凭据不包含真实值。服务器环境由部署决定，任何业务请求不得传 env 切换账户。每个对象操作必须校验工作区成员与资源归属、角色、许可和当前能力。详见
    API-GUIDE.md。
servers:
- url: /v1
  description: Same-origin deployment API root
tags:
- name: Identity
- name: Workspace
- name: Assets
- name: Documents
- name: Content
- name: Layout
- name: Generation
- name: Commerce
- name: Export
- name: Sharing
- name: Notifications
- name: Configuration
- name: Operations
paths:
  /auth/email/login:
    post:
      operationId: loginEmailWeb
      tags:
        - Identity
      summary: loginEmailWeb
      x-module: C3
      x-required-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailLogin"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginSmsWebResponse"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /auth/email/challenges:
    post:
      operationId: createEmailChallenge
      tags:
        - Identity
      summary: createEmailChallenge
      x-module: C3
      x-required-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailChallengeRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailChallengeResponse"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /auth/wechat/mini/link-email:
    post:
      operationId: linkWechatEmail
      tags:
        - Identity
      summary: 同时验证邮箱与微信并主动绑定，不合并已有账号
      description: 微信小程序登录.
      x-module: C3
      x-requirement-ids:
        - AUTH-01
        - CFG-AUTH
        - SEC-01
      x-required-permission: public
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 微信小程序登录
          headers:
            X-Request-Id:
              schema:
                type: string
                minLength: 1
                maxLength: 128
                examples:
                  - prj_demo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginWechatMiniResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                challengeId:
                  type: string
                  minLength: 1
                  maxLength: 128
                verificationCode:
                  type: string
                  pattern: ^[0-9]{6}$
                wechatCode:
                  type: string
                  minLength: 1
                  maxLength: 1024
              required:
                - challengeId
                - verificationCode
                - wechatCode
              additionalProperties: false
      x-idempotency-scope: workspace resolved from target or request; otherwise authenticated user or pre-auth browser challenge
  /auth/wechat/mini/email-challenges:
    post:
      operationId: createEmailWechatChallenge
      tags:
        - Identity
      summary: 主动绑定现有邮箱账号：发送邮箱验证码
      x-module: C3
      x-required-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  minLength: 3
                  maxLength: 254
              required:
                - email
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailChallengeResponse"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /capabilities:
    get:
      operationId: getCapabilities
      tags:
      - Identity
      summary: 读取当前客户端能力
      description: Public sanitized capability statuses only. App is reserved/unavailable, not a delivered binary
        or usable adapter. Sensitive bucket, endpoint, secret refs and procurement details excluded.
      x-module: C3
      x-requirement-ids:
      - CFG-CENTER
      - CFG-AUTH
      - APP-RESERVE
      x-required-permission: public
      security: []
      parameters:
      - name: platform
        in: query
        required: true
        schema:
          type: string
          enum:
          - web
          - mini
          - app_reserved
      responses:
        '200':
          description: 读取当前客户端能力
          headers:
            X-Request-Id:
              schema:
                type: string
                minLength: 1
                maxLength: 128
                examples:
                - prj_demo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCapabilitiesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/wechat/mini:
    post:
      operationId: loginWechatMini
      tags:
      - Identity
      summary: 微信小程序登录
      description: 微信小程序登录.
      x-module: C3
      x-requirement-ids:
      - AUTH-01
      - CFG-AUTH
      - SEC-01
      x-required-permission: public
      security: []
      parameters:

        expiresIn:
          type: integer
          minimum: 60
          maximum: 3600
        refreshToken:
          type: string
          minLength: 32
          maxLength: 4096
        refreshExpiresAt:
          type: string
          format: date-time
      required:
      - user
      - accessToken
      - tokenType
      - expiresIn
      - refreshToken
      - refreshExpiresAt
      additionalProperties: false
    WebSession:
      type: object

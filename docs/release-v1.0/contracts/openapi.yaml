        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsChallengeRequest'
      x-idempotency-scope: workspace resolved from target or request; otherwise authenticated user or pre-auth browser
        challenge
  /auth/sms/sessions:
    post:
      operationId: loginSmsWeb
      tags:
      - Identity
      summary: 短信网页登录
      description: Validate single-use challenge, anti-abuse and Origin/browser login nonce. Set secure cookie;
        body csrf token is bound to cookie. SameSite alone is insufficient login-CSRF protection.
      x-module: C3
      x-requirement-ids:
      - AUTH-01
      - CFG-AUTH
      - SEC-01
      x-required-permission: public
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 短信网页登录
          headers:
            X-Request-Id:
              schema:
                type: string
                minLength: 1
                maxLength: 128
                examples:
                - prj_demo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSmsWebResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsLogin'
      x-idempotency-scope: workspace resolved from target or request; otherwise authenticated user or pre-auth browser
        challenge
  /auth/web/qr-sessions:
    post:
      operationId: createQrSession
      tags:
      - Identity
      summary: 创建网页扫码会话
      description: Bind to anonymous Secure HttpOnly browser nonce and approved Origin. Poll token and scene QR
        have different secrets; QR never contains login bearer. Rate limit and expire within 5 minutes.
      x-module: C3
      x-requirement-ids:
      - AUTH-01
      - SEC-01
      x-required-permission: public
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: 创建网页扫码会话
          headers:
            X-Request-Id:
              schema:
                type: string
                minLength: 1
                maxLength: 128
                examples:
                - prj_demo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateQrSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      x-idempotency-scope: workspace resolved from target or request; otherwise authenticated user or pre-auth browser
        challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QrSessionCreate'
            example:
              browserNonce: DEMO_BROWSER_NONCE_0000000000000000
  /auth/web/qr-sessions/{qrSessionId}:
    get:
      operationId: pollQrSession
      tags:
      - Identity
      summary: 公开扫码流程状态轮询
      description: Public login flow, no authenticated user session needed. Require matching poll capability AND
        browser nonce; 1 second minimum poll spacing. Only confirming browser gets one-use consume proof; not user
        identity or session token.
      x-module: C3
      x-requirement-ids:
      - AUTH-01
      - SEC-01
      x-required-permission: public
      security:
      - QrPollToken: []
      parameters:
      - name: X-Browser-Nonce
        in: header
        required: true
        schema:
          type: string
          minLength: 32
          maxLength: 256
      - name: qrSessionId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          examples:
          - prj_demo
      responses:
        '200':
          description: 公开扫码流程状态轮询
          headers:
            X-Request-Id:
              schema:
                type: string
                minLength: 1
                maxLength: 128
                examples:
                - prj_demo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollQrSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/web/qr-sessions/{qrSessionId}/confirm:
    post:
      operationId: confirmQrSession
      tags:
      - Identity
      summary: 已登录小程序确认扫码
      description: Authenticated mini identity verifies sceneToken and explicit confirmation. Scene token alone
        cannot log browser in. One-time state transition; expired sessions reject.
      x-module: C3
      x-requirement-ids:
      - AUTH-01
      - SEC-01
      x-required-permission: public
      security:
      - MiniBearer: []
      parameters:
      - name: qrSessionId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          examples:
          - prj_demo
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 已登录小程序确认扫码
          headers:
            X-Request-Id:
              schema:
                type: string
                minLength: 1
                maxLength: 128
                examples:
                - prj_demo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmQrSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QrConfirm'
      x-idempotency-scope: workspace resolved from target or request; otherwise authenticated user or pre-auth browser
        challenge
  /auth/web/qr-sessions/{qrSessionId}/consume:
    post:
      operationId: consumeQrSession
      tags:
      - Identity
      summary: 网页单次消费登录确认
      description: Verify approved Origin, original browser nonce, matching poll token and one-use consumeProof
        atomically. Rotate browser session cookie and return CSRF token. Replay only same idempotency key response;
        never transfer proof between browsers.
      x-module: C3
      x-requirement-ids:
      - AUTH-01
      - SEC-01
      x-required-permission: public
      security:
      - QrPollToken: []
      parameters:
      - name: qrSessionId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          examples:
          - prj_demo
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 网页单次消费登录确认
          headers:
            X-Request-Id:
              schema:
                type: string
                minLength: 1
                maxLength: 128
                examples:
                - prj_demo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumeQrSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QrConsume'
      x-idempotency-scope: workspace resolved from target or request; otherwise authenticated user or pre-auth browser
        challenge
  /auth/token/refresh:
    post:
      operationId: refreshMiniSession
      tags:
      - Identity
      summary: 轮换小程序刷新凭据
      description: Opaque refresh token authenticates only this operation. Atomically rotate token family; consumed
        token reuse revokes family. Same key replay may return stored original response over protected transport.
        No cookie session refresh here.
      x-module: C3
      x-requirement-ids:
      - AUTH-01
      - SEC-01
      x-required-permission: public
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 轮换小程序刷新凭据
          headers:
            X-Request-Id:
              schema:
                type: string
                minLength: 1
                maxLength: 128
                examples:
                - prj_demo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshMiniSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshSession'
      x-idempotency-scope: workspace resolved from target or request; otherwise authenticated user or pre-auth browser
        challenge
  /auth/session:
    get:
      operationId: getWebSession
      tags:
      - Identity
      summary: 读取网页会话与CSRF
      description: 读取网页会话与CSRF.
      x-module: C3
      x-requirement-ids:
      - AUTH-01
      - SEC-01
      x-required-permission: public
      security:
      - WebCookie: []
      parameters: []
      responses:
        '200':
          description: 读取网页会话与CSRF
          headers:
            X-Request-Id:
              schema:
                type: string
                minLength: 1
                maxLength: 128
                examples:
                - prj_demo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWebSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

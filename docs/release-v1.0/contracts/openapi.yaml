  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required replay key 16–128 printable ASCII. Workspace scope unique for 7 days across write endpoints;
        same canonical request/method/path returns original response, different payload returns 409 IDEMPOTENCY_MISMATCH.
        User scope before workspace selection. Callback dedup uses authenticated provider event ID instead.
      schema:
        type: string
        minLength: 16
        maxLength: 128
      example: demo_key_0000000000000001
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 'Required CAS header: exactly quoted decimal resource revision, e.g. "12". Missing 428; stale
        409 REVISION_CONFLICT. Must not use wildcard or timestamps.'
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^"[1-9][0-9]*"$
      example: '"12"'
    ReauthenticationProof:
      name: X-Reauthentication-Proof
      in: header
      required: true
      description: Fresh purpose-bound server-issued proof; required for privileged secret/financial/ownership/deletion
        actions; never logged.
      schema:
        type: string
        minLength: 16
        maxLength: 4096
      example: demo_key_0000000000000001
    Cursor:
      name: cursor
      in: query
      description: Opaque signed cursor binding tenant, sort and filters; invalid/expired cursor returns 400. Never
        accepts SQL offsets or resource ownership through cursor.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

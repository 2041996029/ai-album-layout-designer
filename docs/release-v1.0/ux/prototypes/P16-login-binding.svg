<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc"><title id="title">P16 · 登录、账号绑定与注销</title><desc id="desc">WEB-01／02／03 · MINI-01 · 当前身份与目标身份分别验证，订单和作品不自动合并。原创静态演示，不连接真实服务。</desc><style>text{font-family:"Noto Sans CJK SC",sans-serif}</style><rect x="0" y="0" width="1440" height="1080" rx="0" fill="#F3F4EE"/><text x="36" y="44" font-size="26" fill="#183F39" font-weight="700">P16 · 登录、账号绑定与注销</text><text x="36" y="75" font-size="14" fill="#5C6F68" font-weight="400">WEB-01／02／03 · MINI-01 · 当前身份与目标身份分别验证，订单和作品不自动合并</text><rect x="36" y="95" width="1368" height="34" rx="6" fill="#E2EADF"/><text x="50" y="118" font-size="13" fill="#216551" font-weight="400">原创静态线框 · 所有状态为设计示意 · 无真实客户数据、价格、交易或模型结果</text><rect x="36" y="153" width="432" height="774" rx="10" fill="#FFFFFF"/><text x="56" y="188" font-size="19" fill="#183F39" font-weight="700">01 / 微信扫码登录</text><rect x="108" y="217" width="288" height="238" rx="8" fill="#F3F4EE" stroke="#D8E0D8"/><rect x="132" y="239" width="62" height="62" rx="3" fill="#183F39"/><rect x="141" y="248" width="44" height="44" rx="2" fill="#FFFFFF"/><rect x="152" y="259" width="22" height="22" rx="1" fill="#183F39"/><rect x="288" y="239" width="62" height="62" rx="3" fill="#183F39"/><rect x="297" y="248" width="44" height="44" rx="2" fill="#FFFFFF"/><rect x="308" y="259" width="22" height="22" rx="1" fill="#183F39"/><rect x="132" y="365" width="62" height="62" rx="3" fill="#183F39"/><rect x="141" y="374" width="44" height="44" rx="2" fill="#FFFFFF"/><rect x="152" y="385" width="22" height="22" rx="1" fill="#183F39"/><text x="177" y="339" font-size="13" fill="#5C6F68" font-weight="400">二维码位置示意</text><text x="94" y="487" font-size="16" fill="#183F39" font-weight="600">使用微信扫描并在手机上确认</text><text x="92" y="521" font-size="13" fill="#5C6F68" font-weight="400">状态：等待扫描 / 已扫描待确认</text><rect x="103" y="548" width="298" height="42" rx="7" fill="#FFFFFF" stroke="#D8E0D8"/><text x="117" y="575" font-size="14" fill="#183F39" font-weight="600">二维码过期后重新获取</text><rect x="56" y="617" width="392" height="102" rx="7" fill="#E8EEE6"/><text x="69" y="644" font-size="13" fill="#216551" font-weight="400">仅显示已经接通的登录能力</text><text x="69" y="670" font-size="13" fill="#216551" font-weight="400">短信备用：配置且可用时才显示</text><text x="69" y="696" font-size="13" fill="#216551" font-weight="400">不强索头像、昵称或手机号</text><text x="57" y="753" font-size="13" fill="#5C6F68" font-weight="400">离线：无法确认身份，请联网重试</text><text x="57" y="780" font-size="13" fill="#5C6F68" font-weight="400">账号不可用：显示支持与申诉入口</text><text x="57" y="807" font-size="13" fill="#5C6F68" font-weight="400">本页不存储微信身份主键</text><rect x="56" y="845" width="392" height="42" rx="7" fill="#FFFFFF" stroke="#D8E0D8"/><text x="70" y="872" font-size="14" fill="#183F39" font-weight="600">阅读协议与隐私政策</text><rect x="488" y="153" width="432" height="774" rx="10" fill="#FFFFFF"/><text x="508" y="188" font-size="19" fill="#183F39" font-weight="700">02 / 账号绑定</text><text x="508" y="224" font-size="13" fill="#5C6F68" font-weight="400">当前登录方式</text><rect x="508" y="236" width="392" height="42" rx="6" fill="#F3F4EE" stroke="#D8E0D8"/><text x="520" y="263" font-size="14" fill="#183F39" font-weight="400">微信 · 已验证摘要</text><text x="508" y="319" font-size="13" fill="#5C6F68" font-weight="400">要绑定的登录方式</text><rect x="508" y="331" width="392" height="42" rx="6" fill="#F3F4EE" stroke="#D8E0D8"/><text x="520" y="358" font-size="14" fill="#183F39" font-weight="400">选择可用身份验证渠道</text><rect x="508" y="396" width="392" height="42" rx="7" fill="#216551"/><text x="522" y="423" font-size="14" fill="#FFFFFF" font-weight="600">验证目标身份</text><rect x="508" y="466" width="392" height="76" rx="7" fill="#E8EEE6"/><text x="521" y="493" font-size="13" fill="#216551" font-weight="400">两边身份必须分别验证</text><text x="521" y="519" font-size="13" fill="#216551" font-weight="400">同手机号或同昵称不会自动合并</text><text x="508" y="595" font-size="16" fill="#183F39" font-weight="700">目标已有账号时</text><text x="508" y="627" font-size="14" fill="#5C6F68" font-weight="400">提示需要双边验证与归属检查</text><text x="508" y="654" font-size="14" fill="#5C6F68" font-weight="400">未支持安全合并时进入支持处理</text><text x="508" y="681" font-size="14" fill="#5C6F68" font-weight="400">订单与作品归属保持可解释</text><line x1="508" y1="721" x2="900" y2="721" stroke="#D8E0D8"/><text x="508" y="754" font-size="16" fill="#183F39" font-weight="700">解绑前检查恢复方式</text><text x="508" y="786" font-size="13" fill="#5C6F68" font-weight="400">不能移除最后一种有效登录方式</text><text x="508" y="813" font-size="13" fill="#5C6F68" font-weight="400">会话过旧需先重新验证</text><rect x="508" y="849" width="392" height="42" rx="7" fill="#216551"/><text x="522" y="876" font-size="14" fill="#FFFFFF" font-weight="600">确认绑定</text><rect x="940" y="153" width="464" height="774" rx="10" fill="#FFFFFF"/><text x="960" y="188" font-size="19" fill="#183F39" font-weight="700">03 / 账号注销影响确认</text><text x="960" y="224" font-size="13" fill="#5C6F68" font-weight="400">检查当前账号与关联工作区</text><rect x="960" y="236" width="424" height="42" rx="6" fill="#F3F4EE" stroke="#D8E0D8"/><text x="972" y="263" font-size="14" fill="#183F39" font-weight="400">读取未结事项与公示删除政策</text><rect x="960" y="316" width="424" height="76" rx="7" fill="#FFF2D9"/><text x="973" y="343" font-size="13" fill="#936021" font-weight="400">需先处理：进行中的任务 / 退款</text><text x="973" y="369" font-size="13" fill="#936021" font-weight="400">具体事项由服务端返回，不伪造记录</text><text x="960" y="431" font-size="15" fill="#183F39" font-weight="400">注销后：</text><text x="960" y="462" font-size="15" fill="#183F39" font-weight="400">• 撤销全部会话与分享</text><text x="960" y="493" font-size="15" fill="#183F39" font-weight="400">• 停止接受新任务</text><text x="960" y="524" font-size="15" fill="#183F39" font-weight="400">• 照片与派生数据按政策删除</text><text x="960" y="555" font-size="15" fill="#183F39" font-weight="400">• 必要交易审计限权保留</text><rect x="960" y="601" width="22" height="22" rx="4" fill="#FFFFFF" stroke="#D8E0D8"/><text x="994" y="618" font-size="14" fill="#183F39" font-weight="400">我已阅读并理解注销影响</text><rect x="960" y="660" width="424" height="76" rx="7" fill="#E8EEE6"/><text x="973" y="687" font-size="13" fill="#216551" font-weight="400">未结事项或政策缺失时禁止提交</text><text x="973" y="713" font-size="13" fill="#216551" font-weight="400">确认前重新验证本人身份</text><rect x="960" y="778" width="203" height="42" rx="7" fill="#FFFFFF" stroke="#D8E0D8"/><text x="974" y="805" font-size="14" fill="#183F39" font-weight="600">返回账户</text><rect x="1174" y="778" width="210" height="42" rx="7" fill="#E9ECE7" stroke="#D8E0D8"/><text x="1188" y="805" font-size="14" fill="#727F78" font-weight="600">确认注销</text><text x="960" y="871" font-size="13" fill="#5C6F68" font-weight="400">真实申请成功才退出并展示申请号</text><rect x="36" y="951" width="1368" height="76" rx="7" fill="#E8EEE6"/><text x="49" y="978" font-size="13" fill="#216551" font-weight="400">绑定、解绑、注销均为真实身份确认后的动作；原型中的按钮不执行验证或删除。</text><text x="49" y="1004" font-size="13" fill="#216551" font-weight="400">未知网络结果先查询原申请；不重复创建，不在未完成时展示“注销成功”。</text></svg>
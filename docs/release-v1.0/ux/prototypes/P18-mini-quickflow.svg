<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc"><title id="title">P18 · 小程序快速成册与任务接续</title><desc id="desc">MINI-02 → MINI-03／04 → MINI-05／06 → MINI-07 · 每次只调整一个字段或一张照片。原创静态演示，不连接真实服务。</desc><style>text{font-family:"Noto Sans CJK SC",sans-serif}</style><rect x="0" y="0" width="1440" height="1080" rx="0" fill="#F3F4EE"/><text x="36" y="44" font-size="26" fill="#183F39" font-weight="700">P18 · 小程序快速成册与任务接续</text><text x="36" y="75" font-size="14" fill="#5C6F68" font-weight="400">MINI-02 → MINI-03／04 → MINI-05／06 → MINI-07 · 每次只调整一个字段或一张照片</text><rect x="36" y="95" width="1368" height="34" rx="6" fill="#E2EADF"/><text x="50" y="118" font-size="13" fill="#216551" font-weight="400">原创静态线框 · 所有状态为设计示意 · 无真实客户数据、价格、交易或模型结果</text><rect x="36" y="165" width="324" height="742" rx="28" fill="#243F38"/><rect x="45" y="176" width="306" height="720" rx="22" fill="#FFFFFF"/><rect x="151" y="186" width="94" height="10" rx="5" fill="#183F39"/><text x="59" y="238" font-size="17" fill="#183F39" font-weight="700">1 / 选片与上传</text><rect x="384" y="165" width="324" height="742" rx="28" fill="#243F38"/><rect x="393" y="176" width="306" height="720" rx="22" fill="#FFFFFF"/><rect x="499" y="186" width="94" height="10" rx="5" fill="#183F39"/><text x="407" y="238" font-size="17" fill="#183F39" font-weight="700">2 / 设置并比较候选</text><rect x="732" y="165" width="324" height="742" rx="28" fill="#243F38"/><rect x="741" y="176" width="306" height="720" rx="22" fill="#FFFFFF"/><rect x="847" y="186" width="94" height="10" rx="5" fill="#183F39"/><text x="755" y="238" font-size="17" fill="#183F39" font-weight="700">3 / 轻编辑与预览</text><rect x="1080" y="165" width="324" height="742" rx="28" fill="#243F38"/><rect x="1089" y="176" width="306" height="720" rx="22" fill="#FFFFFF"/><rect x="1195" y="186" width="94" height="10" rx="5" fill="#183F39"/><text x="1103" y="238" font-size="17" fill="#183F39" font-weight="700">4 / 任务中心</text><text x="59" y="283" font-size="13" fill="#5C6F68" font-weight="400">上传目录</text><rect x="59" y="295" width="278" height="42" rx="6" fill="#F3F4EE" stroke="#D8E0D8"/><text x="71" y="322" font-size="14" fill="#183F39" font-weight="400">选择目录 / 新建简易目录</text><rect x="59" y="365" width="278" height="61" rx="6" fill="#F3F4EE" stroke="#D8E0D8"/><text x="72" y="402" font-size="14" fill="#183F39" font-weight="400">照片位置 · 待上传</text><rect x="59" y="442" width="278" height="61" rx="6" fill="#F3F4EE" stroke="#D8E0D8"/><text x="72" y="479" font-size="14" fill="#183F39" font-weight="400">照片位置 · 验证中</text><rect x="59" y="519" width="278" height="61" rx="6" fill="#F3F4EE" stroke="#D8E0D8"/><text x="72" y="556" font-size="14" fill="#183F39" font-weight="400">照片位置 · 可用</text><rect x="59" y="621" width="278" height="76" rx="7" fill="#E8EEE6"/><text x="72" y="648" font-size="13" fill="#216551" font-weight="400">JPEG / PNG · 25MB / 80MP</text><text x="72" y="674" font-size="13" fill="#216551" font-weight="400">可用照片才能参加排版</text><rect x="59" y="735" width="278" height="42" rx="7" fill="#216551"/><text x="73" y="762" font-size="14" fill="#FFFFFF" font-weight="600">选择手机照片</text><text x="59" y="821" font-size="13" fill="#5C6F68" font-weight="400">切后台上传可能暂停</text><text x="59" y="848" font-size="12" fill="#5C6F68" font-weight="400">失败逐项重试，已就绪不丢</text><text x="407" y="283" font-size="13" fill="#5C6F68" font-weight="400">相册规格</text><rect x="407" y="295" width="278" height="42" rx="6" fill="#F3F4EE" stroke="#D8E0D8"/><text x="419" y="322" font-size="14" fill="#183F39" font-weight="400">10 跨页 = 20 内页 · 示意</text><text x="407" y="372" font-size="13" fill="#5C6F68" font-weight="400">照片策略</text><rect x="407" y="384" width="278" height="42" rx="6" fill="#F3F4EE" stroke="#D8E0D8"/><text x="419" y="411" font-size="14" fill="#183F39" font-weight="400">默认全部使用，每张一次</text><rect x="407" y="461" width="278" height="118" rx="6" fill="#F3F4EE" stroke="#D8E0D8"/><rect x="420" y="476" width="114" height="77" rx="3" fill="#D2DFD1"/><rect x="548" y="476" width="121" height="77" rx="3" fill="#DDE5D9"/><text x="420" y="568" font-size="12" fill="#5C6F68" font-weight="400">候选布局位置示意</text><rect x="407" y="602" width="278" height="76" rx="7" fill="#E8EEE6"/><text x="420" y="629" font-size="13" fill="#216551" font-weight="400">已用 / 未用 / 重复必须可查</text><text x="420" y="655" font-size="13" fill="#216551" font-weight="400">无有效候选明确解释冲突</text><rect x="407" y="716" width="278" height="42" rx="7" fill="#216551"/><text x="421" y="743" font-size="14" fill="#FFFFFF" font-weight="600">应用已核验的候选</text><text x="407" y="797" font-size="12" fill="#5C6F68" font-weight="400">基线过期需重新计算</text><text x="407" y="824" font-size="12" fill="#5C6F68" font-weight="400">不为了凑3组提供无效方案</text><text x="755" y="283" font-size="13" fill="#5C6F68" font-weight="400">当前字段：相册标题</text><rect x="755" y="295" width="278" height="42" rx="6" fill="#F3F4EE" stroke="#D8E0D8"/><text x="767" y="322" font-size="14" fill="#183F39" font-weight="400">在此输入标题 · 不触发生图</text><rect x="755" y="374" width="278" height="199" rx="6" fill="#F3F4EE" stroke="#D8E0D8"/><rect x="772" y="391" width="111" height="139" rx="3" fill="#D2DFD1"/><rect x="901" y="391" width="113" height="139" rx="3" fill="#DDE5D9"/><text x="772" y="553" font-size="12" fill="#5C6F68" font-weight="400">只读高级层 + 可编辑热点</text><rect x="755" y="595" width="133" height="42" rx="7" fill="#FFFFFF" stroke="#D8E0D8"/><text x="769" y="622" font-size="14" fill="#183F39" font-weight="600">单图裁剪</text><rect x="899" y="595" width="134" height="42" rx="7" fill="#FFFFFF" stroke="#D8E0D8"/><text x="913" y="622" font-size="14" fill="#183F39" font-weight="600">修改文字</text><rect x="755" y="668" width="278" height="76" rx="7" fill="#E8EEE6"/><text x="768" y="695" font-size="13" fill="#216551" font-weight="400">高级图层保留并只读显示</text><text x="768" y="721" font-size="13" fill="#216551" font-weight="400">可在电脑网页继续编辑</text><rect x="755" y="782" width="278" height="42" rx="7" fill="#216551"/><text x="769" y="809" font-size="14" fill="#FFFFFF" font-weight="600">预检后创建导出</text><text x="755" y="855" font-size="12" fill="#5C6F68" font-weight="400">缺图、缺字或超框不能导出</text><rect x="1103" y="282" width="278" height="78" rx="6" fill="#E8EEE6"/><text x="1116" y="310" font-size="15" fill="#183F39" font-weight="700">已接受的导出任务</text><text x="1116" y="339" font-size="12" fill="#216551" font-weight="400">可关闭页面，切端继续查看</text><rect x="1103" y="388" width="278" height="58" rx="6" fill="#F3F4EE" stroke="#D8E0D8"/><text x="1116" y="423" font-size="13" fill="#183F39" font-weight="400">排队中 / 处理中 / 打包中</text><rect x="1103" y="464" width="278" height="58" rx="6" fill="#F3F4EE" stroke="#D8E0D8"/><text x="1116" y="499" font-size="13" fill="#183F39" font-weight="400">成功后：按权限获取产物</text><rect x="1103" y="540" width="278" height="58" rx="6" fill="#F3F4EE" stroke="#D8E0D8"/><text x="1116" y="575" font-size="13" fill="#183F39" font-weight="400">未知生成：确认处理中</text><rect x="1103" y="643" width="278" height="42" rx="7" fill="#FFFFFF" stroke="#D8E0D8"/><text x="1117" y="670" font-size="14" fill="#183F39" font-weight="600">请求取消任务</text><rect x="1103" y="714" width="278" height="76" rx="7" fill="#E8EEE6"/><text x="1116" y="741" font-size="13" fill="#216551" font-weight="400">取消确认前不承诺已取消</text><text x="1116" y="767" font-size="13" fill="#216551" font-weight="400">订阅消息由用户另行授权</text><text x="1103" y="838" font-size="11" fill="#5C6F68" font-weight="400">保存图片或文件取决于真实平台能力</text><rect x="36" y="943" width="1368" height="76" rx="7" fill="#E8EEE6"/><text x="49" y="970" font-size="13" fill="#216551" font-weight="400">离线只保留已持久化的本地修改；重新联网先核对 revision，再同步，不覆盖网页高级图层。</text><text x="49" y="996" font-size="13" fill="#216551" font-weight="400">普通照片排版不调用生图。任务持久化发生在服务端接受以后，上传读文件和候选临时计算不能承诺关闭后继续。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc"><title id="title">P19 · 后台任务、对账与受控处理</title><desc id="desc">ADMIN-16／20／21／23／24／27／28 · 平台角色按职责查看摘要，不默认获得客户原片访问权。原创静态演示，不连接真实服务。</desc><style>text{font-family:"Noto Sans CJK SC",sans-serif}</style><rect x="0" y="0" width="1440" height="1080" rx="0" fill="#F3F4EE"/><text x="36" y="44" font-size="26" fill="#183F39" font-weight="700">P19 · 后台任务、对账与受控处理</text><text x="36" y="75" font-size="14" fill="#5C6F68" font-weight="400">ADMIN-16／20／21／23／24／27／28 · 平台角色按职责查看摘要，不默认获得客户原片访问权</text><rect x="36" y="95" width="1368" height="34" rx="6" fill="#E2EADF"/><text x="50" y="118" font-size="13" fill="#216551" font-weight="400">原创静态线框 · 所有状态为设计示意 · 无真实客户数据、价格、交易或模型结果</text><rect x="36" y="153" width="218" height="774" rx="10" fill="#FFFFFF"/><text x="55" y="194" font-size="16" fill="#183F39" font-weight="700">运营工作区 · 静态示意</text><rect x="48" y="224" width="194" height="46" rx="7" fill="#FFFFFF"/><text x="62" y="253" font-size="14" fill="#5C6F68" font-weight="400">配置概览 / 20域</text><rect x="48" y="286" width="194" height="46" rx="7" fill="#E8EEE6"/><text x="62" y="315" font-size="14" fill="#216551" font-weight="400">任务查询</text><rect x="48" y="348" width="194" height="46" rx="7" fill="#E8EEE6"/><text x="62" y="377" font-size="14" fill="#216551" font-weight="400">订单与退款对账</text><rect x="48" y="410" width="194" height="46" rx="7" fill="#FFFFFF"/><text x="62" y="439" font-size="14" fill="#5C6F68" font-weight="400">存储迁移</text><rect x="48" y="472" width="194" height="46" rx="7" fill="#FFFFFF"/><text x="62" y="501" font-size="14" fill="#5C6F68" font-weight="400">备份与删除</text><rect x="48" y="534" width="194" height="46" rx="7" fill="#FFFFFF"/><text x="62" y="563" font-size="14" fill="#5C6F68" font-weight="400">许可登记</text><rect x="48" y="596" width="194" height="46" rx="7" fill="#FFFFFF"/><text x="62" y="625" font-size="14" fill="#5C6F68" font-weight="400">审计记录</text><rect x="48" y="734" width="194" height="76" rx="7" fill="#E8EEE6"/><text x="61" y="761" font-size="13" fill="#216551" font-weight="400">无用户照片浏览入口</text><text x="61" y="787" font-size="13" fill="#216551" font-weight="400">秘密只写入不读回</text><rect x="274" y="153" width="1130" height="355" rx="10" fill="#FFFFFF"/><text x="294" y="188" font-size="19" fill="#183F39" font-weight="700">任务与结算摘要 / ADMIN-23</text><text x="294" y="222" font-size="13" fill="#5C6F68" font-weight="400">查询范围</text><rect x="294" y="234" width="304" height="42" rx="6" fill="#F3F4EE" stroke="#D8E0D8"/><text x="306" y="261" font-size="14" fill="#183F39" font-weight="400">任务号 / 请求号 / 工单</text><text x="618" y="222" font-size="13" fill="#5C6F68" font-weight="400">角色限定可见字段</text><rect x="618" y="234" width="360" height="42" rx="6" fill="#F3F4EE" stroke="#D8E0D8"/><text x="630" y="261" font-size="14" fill="#183F39" font-weight="400">ops技术 / finance结算 / support摘要</text><rect x="999" y="234" width="385" height="42" rx="7" fill="#FFFFFF" stroke="#D8E0D8"/><text x="1013" y="261" font-size="14" fill="#183F39" font-weight="600">查询已接受任务状态</text><rect x="294" y="310" width="1090" height="44" rx="5" fill="#F3F4EE"/><text x="308" y="338" font-size="13" fill="#183F39" font-weight="600">任务号位置</text><text x="532" y="338" font-size="13" fill="#183F39" font-weight="600">执行阶段</text><text x="760" y="338" font-size="13" fill="#183F39" font-weight="600">点数状态</text><text x="1000" y="338" font-size="13" fill="#183F39" font-weight="600">允许动作</text><text x="308" y="383" font-size="14" fill="#5C6F68" font-weight="400">示意 · 非真实任务</text><text x="532" y="383" font-size="14" fill="#936021" font-weight="400">确认处理中</text><text x="760" y="383" font-size="14" fill="#936021" font-weight="400">保留预占</text><text x="1000" y="383" font-size="14" fill="#216551" font-weight="400">查询原供应商</text><rect x="294" y="410" width="1090" height="50" rx="7" fill="#E8EEE6"/><text x="307" y="437" font-size="13" fill="#216551" font-weight="400">上游是否接受尚不明确：查询原请求，不直接再次付费提交；不能手工设成功、强发结果或强改账本。</text><rect x="274" y="527" width="692" height="400" rx="10" fill="#FFFFFF"/><text x="294" y="562" font-size="19" fill="#183F39" font-weight="700">订单、退款与履约对账 / ADMIN-24</text><text x="294" y="603" font-size="14" fill="#183F39" font-weight="400">收款事实 ↔ 渠道查询 ↔ 履约记录 ↔ 点数源批次</text><text x="294" y="636" font-size="14" fill="#183F39" font-weight="400">差异标记与工单保留，不以重复发权益“修复”</text><text x="294" y="669" font-size="14" fill="#183F39" font-weight="400">退款只冻结本单来源，先检查已消耗和未终结任务</text><line x1="294" y1="695" x2="946" y2="695" stroke="#D8E0D8"/><text x="294" y="731" font-size="15" fill="#183F39" font-weight="600">执行退款前确认：工作区、金额、范围、政策</text><rect x="294" y="761" width="193" height="42" rx="7" fill="#FFFFFF" stroke="#D8E0D8"/><text x="308" y="788" font-size="14" fill="#183F39" font-weight="600">读取渠道状态</text><rect x="501" y="761" width="205" height="42" rx="7" fill="#FFFFFF" stroke="#D8E0D8"/><text x="515" y="788" font-size="14" fill="#183F39" font-weight="600">预览退款影响</text><rect x="720" y="761" width="226" height="42" rx="7" fill="#FFFFFF" stroke="#D8E0D8"/><text x="734" y="788" font-size="14" fill="#183F39" font-weight="600">授权后提交退款</text><text x="294" y="842" font-size="13" fill="#5C6F68" font-weight="400">正常退款可由单个有权finance操作</text><text x="294" y="875" font-size="13" fill="#5C6F68" font-weight="400">异常人工调整可另启双人复核；不是默认阻断</text><rect x="986" y="527" width="418" height="400" rx="10" fill="#FFFFFF"/><text x="1006" y="562" font-size="19" fill="#183F39" font-weight="700">操作约束与审计</text><text x="1006" y="599" font-size="13" fill="#5C6F68" font-weight="400">原因 / 关联工单</text><rect x="1006" y="611" width="378" height="42" rx="6" fill="#F3F4EE" stroke="#D8E0D8"/><text x="1018" y="638" font-size="14" fill="#183F39" font-weight="400">执行前必填，禁止写密钥</text><text x="1006" y="689" font-size="13" fill="#5C6F68" font-weight="400">前后影响与权限</text><rect x="1006" y="701" width="378" height="42" rx="6" fill="#F3F4EE" stroke="#D8E0D8"/><text x="1018" y="728" font-size="14" fill="#183F39" font-weight="400">按动作展示，提交时重新校验</text><rect x="1006" y="776" width="378" height="102" rx="7" fill="#E8EEE6"/><text x="1019" y="803" font-size="13" fill="#216551" font-weight="400">管理员不因角色自动看客户原片</text><text x="1019" y="829" font-size="13" fill="#216551" font-weight="400">审计不存密钥或完整提示词</text><text x="1019" y="855" font-size="13" fill="#216551" font-weight="400">操作结果以真实渠道与账本为准</text><rect x="36" y="951" width="1368" height="76" rx="7" fill="#E8EEE6"/><text x="49" y="978" font-size="13" fill="#216551" font-weight="400">部署恢复、迁移、发布和财务动作都须具体可审查范围与专项权限；此原创线框不执行任何后台动作。</text><text x="49" y="1004" font-size="13" fill="#216551" font-weight="400">没有实际恢复演练和生产接入时，状态显示“未验证”；不以静态原型证明业务已经可用。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc"><title id="title">P17 · 会员购买、支付确认与退款</title><desc id="desc">WEB-17／18／19／20 · MINI-08 · 当前工作区明确，收费参数均来自正式发布商品。原创静态演示，不连接真实服务。</desc><style>text{font-family:"Noto Sans CJK SC",sans-serif}</style><rect x="0" y="0" width="1440" height="1080" rx="0" fill="#F3F4EE"/><text x="36" y="44" font-size="26" fill="#183F39" font-weight="700">P17 · 会员购买、支付确认与退款</text><text x="36" y="75" font-size="14" fill="#5C6F68" font-weight="400">WEB-17／18／19／20 · MINI-08 · 当前工作区明确，收费参数均来自正式发布商品</text><rect x="36" y="95" width="1368" height="34" rx="6" fill="#E2EADF"/><text x="50" y="118" font-size="13" fill="#216551" font-weight="400">原创静态线框 · 所有状态为设计示意 · 无真实客户数据、价格、交易或模型结果</text><rect x="36" y="153" width="422" height="774" rx="10" fill="#FFFFFF"/><text x="56" y="188" font-size="19" fill="#183F39" font-weight="700">01 / 会员与点数</text><text x="56" y="224" font-size="13" fill="#5C6F68" font-weight="400">权益归属</text><rect x="56" y="236" width="382" height="42" rx="6" fill="#F3F4EE" stroke="#D8E0D8"/><text x="68" y="263" font-size="14" fill="#183F39" font-weight="400">当前工作区 · 示例名称</text><text x="56" y="321" font-size="21" fill="#183F39" font-weight="700">期限会员</text><text x="56" y="357" font-size="14" fill="#5C6F68" font-weight="400">有效天数 / 存储 / 导出并发</text><text x="56" y="384" font-size="14" fill="#5C6F68" font-weight="400">模板使用范围按各素材许可</text><text x="56" y="411" font-size="14" fill="#5C6F68" font-weight="400">AI 点数可用、预占、将过期分列</text><rect x="56" y="462" width="382" height="76" rx="7" fill="#E8EEE6"/><text x="69" y="489" font-size="13" fill="#216551" font-weight="400">尚未发布商品时：暂未开放购买</text><text x="69" y="515" font-size="13" fill="#216551" font-weight="400">此线框不预填正式价格或点数</text><rect x="56" y="563" width="382" height="42" rx="7" fill="#E9ECE7" stroke="#D8E0D8"/><text x="70" y="590" font-size="14" fill="#727F78" font-weight="600">选择可购买商品</text><line x1="56" y1="643" x2="438" y2="643" stroke="#D8E0D8"/><text x="56" y="680" font-size="18" fill="#183F39" font-weight="700">兑换码</text><text x="56" y="716" font-size="13" fill="#5C6F68" font-weight="400">兑换到当前工作区</text><rect x="56" y="728" width="382" height="42" rx="6" fill="#F3F4EE" stroke="#D8E0D8"/><text x="68" y="755" font-size="14" fill="#183F39" font-weight="400">输入后遮挡中段，不缓存原码</text><rect x="56" y="799" width="382" height="42" rx="7" fill="#FFFFFF" stroke="#D8E0D8"/><text x="70" y="826" font-size="14" fill="#183F39" font-weight="600">验证权益并确认兑换</text><text x="56" y="886" font-size="13" fill="#5C6F68" font-weight="400">仅 owner 可购买、兑换、申请退款</text><rect x="478" y="153" width="442" height="774" rx="10" fill="#FFFFFF"/><text x="498" y="188" font-size="19" fill="#183F39" font-weight="700">02 / 支付前确认与查单</text><text x="498" y="225" font-size="15" fill="#183F39" font-weight="400">当前工作区：按实际选择</text><text x="498" y="259" font-size="15" fill="#183F39" font-weight="400">商品 / 版本：正式商品数据</text><text x="498" y="293" font-size="15" fill="#183F39" font-weight="400">金额 / 天数：正式报价数据</text><text x="498" y="327" font-size="15" fill="#183F39" font-weight="400">退款条款：购买前可读</text><rect x="498" y="393" width="402" height="46" rx="7" fill="#F3F4EE" stroke="#D8E0D8"/><text x="511" y="423" font-size="15" fill="#183F39" font-weight="600">数字权益按真实渠道能力开放</text><rect x="498" y="465" width="402" height="102" rx="7" fill="#FFF2D9"/><text x="511" y="492" font-size="13" fill="#936021" font-weight="400">小程序：按系统与版本检查虚拟支付</text><text x="511" y="518" font-size="13" fill="#936021" font-weight="400">未准入不显示可用购买按钮</text><text x="511" y="544" font-size="13" fill="#936021" font-weight="400">不以实物支付或站外引导绕过规则</text><rect x="498" y="586" width="402" height="42" rx="7" fill="#E9ECE7" stroke="#D8E0D8"/><text x="512" y="613" font-size="14" fill="#727F78" font-weight="600">确认条款并支付</text><text x="498" y="677" font-size="17" fill="#183F39" font-weight="700">支付返回后的真实状态</text><text x="498" y="715" font-size="14" fill="#5C6F68" font-weight="400">等待服务端确认 → 正在开通 → 已开通</text><text x="498" y="742" font-size="14" fill="#5C6F68" font-weight="400">前端 success 仅触发查单</text><text x="498" y="769" font-size="14" fill="#5C6F68" font-weight="400">未知状态保留原订单，不重复付款</text><rect x="498" y="825" width="192" height="42" rx="7" fill="#FFFFFF" stroke="#D8E0D8"/><text x="512" y="852" font-size="14" fill="#183F39" font-weight="600">重新查询订单</text><rect x="702" y="825" width="198" height="42" rx="7" fill="#FFFFFF" stroke="#D8E0D8"/><text x="716" y="852" font-size="14" fill="#183F39" font-weight="600">返回权益页</text><rect x="940" y="153" width="464" height="774" rx="10" fill="#FFFFFF"/><text x="960" y="188" font-size="19" fill="#183F39" font-weight="700">03 / 本单退款影响</text><text x="960" y="225" font-size="15" fill="#183F39" font-weight="400">本单收款事实保持</text><text x="960" y="259" font-size="15" fill="#183F39" font-weight="400">可退范围由已发布政策与渠道确认</text><text x="960" y="293" font-size="15" fill="#183F39" font-weight="400">点数：可用 / 预占 / 已消耗 / 冻结</text><text x="960" y="327" font-size="15" fill="#183F39" font-weight="400">只冻结本订单来源，不挪用其他批次</text><rect x="960" y="390" width="424" height="76" rx="7" fill="#FFF2D9"/><text x="973" y="417" font-size="13" fill="#936021" font-weight="400">有未结任务先取消确认或完成结算</text><text x="973" y="443" font-size="13" fill="#936021" font-weight="400">申请退款不代表已到账</text><text x="960" y="500" font-size="18" fill="#183F39" font-weight="700">申请前确认</text><text x="960" y="538" font-size="14" fill="#5C6F68" font-weight="400">将撤销哪些会员 grant</text><text x="960" y="565" font-size="14" fill="#5C6F68" font-weight="400">哪些点数将被冻结或返还</text><text x="960" y="592" font-size="14" fill="#5C6F68" font-weight="400">是否需要人工处理及原因</text><text x="960" y="619" font-size="14" fill="#5C6F68" font-weight="400">不影响其他独立购买</text><rect x="960" y="670" width="424" height="42" rx="7" fill="#FFFFFF" stroke="#D8E0D8"/><text x="974" y="697" font-size="14" fill="#183F39" font-weight="600">查看影响后申请退款</text><text x="960" y="762" font-size="17" fill="#183F39" font-weight="700">进度按真实服务端状态</text><text x="960" y="799" font-size="14" fill="#5C6F68" font-weight="400">申请中 → 渠道处理中 → 已退款</text><text x="960" y="826" font-size="14" fill="#5C6F68" font-weight="400">失败：保留收款事实和支持入口</text><text x="960" y="853" font-size="14" fill="#5C6F68" font-weight="400">正常授权退款不默认要求第二人</text><rect x="36" y="951" width="1368" height="76" rx="7" fill="#E8EEE6"/><text x="49" y="978" font-size="13" fill="#216551" font-weight="400">到期不删除原片；已接受任务按提交时权益完成。会员去品牌水印不删除应保留的 AI 来源标识。</text><text x="49" y="1004" font-size="13" fill="#216551" font-weight="400">自动续费不在首期；原型不产生真实订单、扣款、兑换、开通或退款。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img"><title>P08 · 管理后台与运营</title><desc>仅示意必要运维入口；指标为演示数据。财务、客服、模板运营按角色分权。</desc><style>text{font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif} .muted{fill:#6C7772}</style><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F5F4EF"/><text x="32" y="39" font-size="22" fill="#203B35" font-weight="700">P08 · 管理后台与运营</text><text x="32" y="66" font-size="13" fill="#6C7772" font-weight="400">仅示意必要运维入口；指标为演示数据。财务、客服、模板运营按角色分权。</text><rect x="24" y="86" width="1392" height="64" rx="10" fill="#FFFFFF"/><text x="44" y="125" font-size="21" fill="#203B35" font-weight="700">拾光相册 · 管理控制台</text><rect x="1160" y="105" width="224" height="25" rx="12" fill="#E6EEE6"/><text x="1170" y="122" font-size="11" fill="#26614E" font-weight="600">演示环境 · 非生产数据</text><rect x="24" y="166" width="218" height="780" rx="10" fill="#FFFFFF"/><text x="46" y="206" font-size="15" fill="#6C7772" font-weight="400">运营概览</text><text x="46" y="266" font-size="15" fill="#6C7772" font-weight="400">模板与素材</text><text x="46" y="326" font-size="15" fill="#6C7772" font-weight="400">生成风格预设</text><text x="46" y="386" font-size="15" fill="#26614E" font-weight="600">任务中心</text><text x="46" y="446" font-size="15" fill="#6C7772" font-weight="400">订单与退款</text><text x="46" y="506" font-size="15" fill="#6C7772" font-weight="400">会员与点数</text><text x="46" y="566" font-size="15" fill="#6C7772" font-weight="400">兑换码批次</text><text x="46" y="626" font-size="15" fill="#6C7772" font-weight="400">审计日志</text><rect x="264" y="166" width="266" height="114" rx="10" fill="#FFFFFF"/><text x="282" y="200" font-size="14" fill="#6C7772" font-weight="400">排队任务</text><text x="282" y="247" font-size="28" fill="#203B35" font-weight="700">12</text><rect x="550" y="166" width="266" height="114" rx="10" fill="#FFFFFF"/><text x="568" y="200" font-size="14" fill="#6C7772" font-weight="400">待确认订单</text><text x="568" y="247" font-size="28" fill="#203B35" font-weight="700">2</text><rect x="836" y="166" width="266" height="114" rx="10" fill="#FFFFFF"/><text x="854" y="200" font-size="14" fill="#6C7772" font-weight="400">需复核生成</text><text x="854" y="247" font-size="28" fill="#203B35" font-weight="700">3</text><rect x="1122" y="166" width="266" height="114" rx="10" fill="#FFFFFF"/><text x="1140" y="200" font-size="14" fill="#6C7772" font-weight="400">今日成本</text><text x="1140" y="247" font-size="28" fill="#203B35" font-weight="700">预算内</text><rect x="264" y="299" width="1136" height="376" rx="10" fill="#FFFFFF"/><text x="284" y="336" font-size="21" fill="#203B35" font-weight="700">任务查询</text><rect x="284" y="354" width="654" height="38" rx="6" fill="#F5F4EF"/><text x="298" y="379" font-size="13" fill="#6C7772" font-weight="400">任务编号 / 订单编号 / 工作区</text><rect x="956" y="354" width="172" height="38" rx="7" fill="#FFFFFF" stroke="#DCE2DB"/><text x="970" y="379" font-size="13" fill="#203B35" font-weight="600">搜索</text><rect x="1144" y="354" width="234" height="38" rx="7" fill="#FFFFFF" stroke="#DCE2DB"/><text x="1158" y="379" font-size="13" fill="#203B35" font-weight="600">查看失败任务</text><text x="284" y="428" font-size="13" fill="#6C7772" font-weight="600">任务</text><text x="500" y="428" font-size="13" fill="#6C7772" font-weight="600">类型</text><text x="660" y="428" font-size="13" fill="#6C7772" font-weight="600">状态</text><text x="850" y="428" font-size="13" fill="#6C7772" font-weight="600">最近更新</text><text x="1090" y="428" font-size="13" fill="#6C7772" font-weight="600">操作</text><line x1="284" y1="446" x2="1380" y2="446" stroke="#DCE2DB"/><text x="284" y="467" font-size="13" fill="#203B35" font-weight="400">EXP-DEMO-001</text><text x="500" y="467" font-size="13" fill="#203B35" font-weight="400">导出</text><text x="660" y="467" font-size="13" fill="#203B35" font-weight="400">处理中</text><text x="850" y="467" font-size="13" fill="#6C7772" font-weight="400">演示时间</text><text x="1090" y="467" font-size="13" fill="#26614E" font-weight="600">查看详情</text><line x1="284" y1="513" x2="1380" y2="513" stroke="#DCE2DB"/><text x="284" y="534" font-size="13" fill="#203B35" font-weight="400">GEN-DEMO-002</text><text x="500" y="534" font-size="13" fill="#203B35" font-weight="400">AI 生成</text><text x="660" y="534" font-size="13" fill="#203B35" font-weight="400">确认处理中</text><text x="850" y="534" font-size="13" fill="#6C7772" font-weight="400">演示时间</text><text x="1090" y="534" font-size="13" fill="#26614E" font-weight="600">查询供应商</text><line x1="284" y1="580" x2="1380" y2="580" stroke="#DCE2DB"/><text x="284" y="601" font-size="13" fill="#203B35" font-weight="400">EXP-DEMO-003</text><text x="500" y="601" font-size="13" fill="#203B35" font-weight="400">导出</text><text x="660" y="601" font-size="13" fill="#203B35" font-weight="400">失败：字体缺失</text><text x="850" y="601" font-size="13" fill="#6C7772" font-weight="400">演示时间</text><text x="1090" y="601" font-size="13" fill="#26614E" font-weight="600">查看错误</text><rect x="264" y="699" width="551" height="118" rx="9" fill="#E9EEE7"/><text x="278" y="724" font-size="13" fill="#26614E" font-weight="700">人工补偿与退款</text><text x="278" y="748" font-size="12" fill="#6C7772" font-weight="400">补点、延长期限、退款必须填写原因和关联工单。</text><text x="278" y="770" font-size="12" fill="#6C7772" font-weight="400">权限校验与审计必需；财务操作可设双人复核。</text><text x="278" y="792" font-size="12" fill="#6C7772" font-weight="400">重试走同一业务入口，不直接更改账本历史。</text><rect x="839" y="699" width="561" height="118" rx="9" fill="#E9EEE7"/><text x="853" y="724" font-size="13" fill="#26614E" font-weight="700">运维与隐私</text><text x="853" y="748" font-size="12" fill="#6C7772" font-weight="400">关注保存失败、队列等待、重复履约与 AI 成本。</text><text x="853" y="770" font-size="12" fill="#6C7772" font-weight="400">客服无权读取原片、密钥或完整支付凭据。</text><text x="853" y="792" font-size="12" fill="#6C7772" font-weight="400">发布与回滚记录版本；恢复后先对账再恢复写入。</text></svg>
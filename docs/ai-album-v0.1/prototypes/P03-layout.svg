片 02</text><text x="503.38" y="598.6800000000001" font-size="10" fill="#203B35" font-weight="400">我们的美好时光</text><text x="786" y="512" font-size="18" fill="#203B35" font-weight="700">方案 B · 丰富拼贴</text><text x="786" y="545" font-size="13" fill="#6C7772" font-weight="400">50 / 50 张 · 密度较高</text><text x="786" y="573" font-size="13" fill="#6C7772" font-weight="400">10 跨页 · 0 张重复 · 0 张未使用</text><rect x="1174" y="565" width="180" height="38" rx="7" fill="#FFFFFF" stroke="#DCE2DB"/><text x="1188" y="590" font-size="13" fill="#203B35" font-weight="600">比较整本</text><rect x="462" y="648" width="918" height="166" rx="10" fill="#FFFFFF"/><rect x="478" y="663" width="282" height="136" rx="2" fill="#FFFEFA" stroke="#DCE2DB"/><line x1="619.0" y1="663" x2="619.0" y2="799" stroke="#D8D4C8"/><rect x="489.28" y="684.76" width="78.96000000000001" height="74.80000000000001" rx="4" fill="#C9D8CC"/><path d="M491.28 757.56 L516.9159999999999 714.68 L538.2352 738.616 L552.448 722.16 L566.24 757.56 Z" fill="#A7BFAF"/><circle cx="548.5" cy="703.46" r="5.984000000000001" fill="#F5EEE0"/><text x="499.28" y="747.56" font-size="11" fill="#203B35" font-weight="400">照片 1</text><rect x="579.52" y="684.76" width="78.96000000000001" height="74.80000000000001" rx="4" fill="#C9D8CC"/><path d="M581.52 757.56 L607.156 714.68 L628.4752 738.616 L642.688 722.16 L656.48 757.56 Z" fill="#A7BFAF"/><circle cx="638.74" cy="703.46" r="5.984000000000001" fill="#F5EEE0"/><text x="589.52" y="747.56" font-size="11" fill="#203B35" font-weight="400">照片 2</text><rect x="669.76" y="684.76" width="78.96000000000001" height="74.80000000000001" rx="4" fill="#C9D8CC"/><path d="M671.76 757.56 L697.396 714.68 L718.7152 738.616 L732.928 722.16 L746.72 757.56 Z" fill="#A7BFAF"/><circle cx="728.98" cy="703.46" r="5.984000000000001" fill="#F5EEE0"/><text x="679.76" y="747.56" font-size="11" fill="#203B35" font-weight="400">照片 3</text><text x="500.56" y="779.96" font-size="10" fill="#203B35" font-weight="400">一起走过的四季</text><text x="786" y="696" font-size="18" fill="#203B35" font-weight="700">方案 C · 大图故事</text><text x="786" y="729" font-size="13" fill="#6C7772" font-weight="400">50 / 50 张 · 主图突出</text><text x="786" y="757" font-size="13" fill="#6C7772" font-weight="400">10 跨页 · 0 张重复 · 0 张未使用</text><rect x="1174" y="749" width="180" height="38" rx="7" fill="#FFFFFF" stroke="#DCE2DB"/><text x="1188" y="774" font-size="13" fill="#203B35" font-weight="600">比较整本</text><rect x="462" y="850" width="616" height="96" rx="9" fill="#E9EEE7"/><text x="476" y="875" font-size="13" fill="#26614E" font-weight="700">应用前检查</text><text x="476" y="899" font-size="12" fill="#6C7772" font-weight="400">基于已保存版本生成；当前作品有新修改时重新确认。</text><text x="476" y="921" font-size="12" fill="#6C7772" font-weight="400">应用作为一个操作，可撤销；未选跨页保持不变。</text><rect x="1110" y="866" width="268" height="38" rx="7" fill="#26614E"/><text x="1124" y="891" font-size="13" fill="#FFFFFF" font-weight="600">应用方案 A</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img"><title>P03 · AI 智能排版与候选比较</title><desc>先验证硬约束，再按可解释评分推荐；生成候选不会直接覆盖当前作品。</desc><style>text{font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif} .muted{fill:#6C7772}</style><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F5F4EF"/><text x="32" y="39" font-size="22" fill="#203B35" font-weight="700">P03 · AI 智能排版与候选比较</text><text x="32" y="66" font-size="13" fill="#6C7772" font-weight="400">先验证硬约束，再按可解释评分推荐；生成候选不会直接覆盖当前作品。</text><rect x="24" y="86" width="1392" height="64" rx="12" fill="#FFFFFF"/><text x="44" y="126" font-size="20" fill="#26614E" font-weight="700">拾光相册</text><text x="240" y="125" font-size="14" fill="#26614E" font-weight="600">我的相册</text><text x="390" y="125" font-size="14" fill="#6C7772" font-weight="400">模板中心</text><text x="540" y="125" font-size="14" fill="#6C7772" font-weight="400">AI 水墨彩绘</text><text x="690" y="125" font-size="14" fill="#6C7772" font-weight="400">任务中心</text><rect x="1160" y="105" width="88" height="25" rx="12" fill="#E6EEE6"/><text x="1170" y="122" font-size="11" fill="#26614E" font-weight="600">个人工作区</text><text x="1270" y="125" font-size="13" fill="#203B35" font-weight="400">账号与会员</text><rect x="44" y="176" width="390" height="770" rx="10" fill="#FFFFFF"/><text x="66" y="217" font-size="22" fill="#203B35" font-weight="700">排版设置</text><text x="66" y="254" font-size="14" fill="#6C7772" font-weight="400">已选 50 张 · 必选 12 张</text><text x="66" y="280" font-size="12" fill="#6C7772" font-weight="400">相册规格</text><rect x="64" y="292" width="346" height="38" rx="6" fill="#F5F4EF"/><text x="77" y="317" font-size="13" fill="#203B35" font-weight="400">300 × 300 mm · 20 内页</text><text x="66" y="353" font-size="12" fill="#6C7772" font-weight="400">照片顺序</text><rect x="64" y="365" width="346" height="38" rx="6" fill="#F5F4EF"/><text x="77" y="390" font-size="13" fill="#203B35" font-weight="400">优先按拍摄时间</text><text x="66" y="426" font-size="12" fill="#6C7772" font-weight="400">每跨页照片</text><rect x="64" y="438" width="346" height="38" rx="6" fill="#F5F4EF"/><text x="77" y="463" font-size="13" fill="#203B35" font-weight="400">最少 2 张 · 最多 6 张</text><text x="66" y="499" font-size="12" fill="#6C7772" font-weight="400">版式风格</text><rect x="64" y="511" width="346" height="38" rx="6" fill="#F5F4EF"/><text x="77" y="536" font-size="13" fill="#203B35" font-weight="400">自然留白</text><text x="66" y="572" font-size="12" fill="#6C7772" font-weight="400">保留锁定项</text><rect x="64" y="584" width="346" height="38" rx="6" fill="#F5F4EF"/><text x="77" y="609" font-size="13" fill="#203B35" font-weight="400">封面和 2 张主图</text><text x="66" y="645" font-size="12" fill="#6C7772" font-weight="400">模板复用</text><rect x="64" y="657" width="346" height="38" rx="6" fill="#F5F4EF"/><text x="77" y="682" font-size="13" fill="#203B35" font-weight="400">适中，保留整本一致性</text><rect x="66" y="754" width="346" height="38" rx="7" fill="#26614E"/><text x="80" y="779" font-size="13" fill="#FFFFFF" font-weight="600">生成 3 组候选</text><rect x="66" y="813" width="346" height="96" rx="9" fill="#E9EEE7"/><text x="80" y="838" font-size="13" fill="#26614E" font-weight="700">照片去向透明</text><text x="80" y="862" font-size="12" fill="#6C7772" font-weight="400">全部使用，禁止静默丢图。</text><text x="80" y="884" font-size="12" fill="#6C7772" font-weight="400">约束无解时提示增加页数或调整密度。</text><text x="462" y="216" font-size="24" fill="#203B35" font-weight="700">选择喜欢的节奏</text><text x="462" y="249" font-size="14" fill="#6C7772" font-weight="400">比较整本草稿；也可以只重排当前跨页。</text><rect x="462" y="280" width="918" height="166" rx="10" fill="#FFFFFF" stroke="#26614E"/><rect x="478" y="295" width="282" height="136" rx="2" fill="#FFFEFA" stroke="#DCE2DB"/><line x1="619.0" y1="295" x2="619.0" y2="431" stroke="#D8D4C8"/><rect x="489.28" y="305.88" width="115.61999999999999" height="108.80000000000001" rx="4" fill="#C9D8CC"/><path d="M491.28 412.68 L529.747 349.4 L560.9644 384.216 L581.776 360.28 L602.9 4
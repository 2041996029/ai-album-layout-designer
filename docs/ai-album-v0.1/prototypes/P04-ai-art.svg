<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img"><title>P04 · 热门 AI 水墨彩绘</title><desc>风景示意为原创矢量线框，不是实际模型生成效果；报价、审核、结果均为设计状态。</desc><style>text{font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif} .muted{fill:#6C7772}</style><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F5F4EF"/><text x="32" y="39" font-size="22" fill="#203B35" font-weight="700">P04 · 热门 AI 水墨彩绘</text><text x="32" y="66" font-size="13" fill="#6C7772" font-weight="400">风景示意为原创矢量线框，不是实际模型生成效果；报价、审核、结果均为设计状态。</text><rect x="24" y="86" width="1392" height="64" rx="12" fill="#FFFFFF"/><text x="44" y="126" font-size="20" fill="#26614E" font-weight="700">拾光相册</text><text x="240" y="125" font-size="14" fill="#6C7772" font-weight="400">我的相册</text><text x="390" y="125" font-size="14" fill="#6C7772" font-weight="400">模板中心</text><text x="540" y="125" font-size="14" fill="#26614E" font-weight="600">AI 水墨彩绘</text><text x="690" y="125" font-size="14" fill="#6C7772" font-weight="400">任务中心</text><rect x="1160" y="105" width="88" height="25" rx="12" fill="#E6EEE6"/><text x="1170" y="122" font-size="11" fill="#26614E" font-weight="600">个人工作区</text><text x="1270" y="125" font-size="13" fill="#203B35" font-weight="400">账号与会员</text><rect x="44" y="176" width="410" height="760" rx="10" fill="#FFFFFF"/><text x="66" y="217" font-size="23" fill="#203B35" font-weight="700">创作一张国风画</text><rect x="66" y="241" width="114" height="25" rx="12" fill="#DCE9DE"/><text x="76" y="258" font-size="11" fill="#26614E" font-weight="600">山水水墨</text><rect x="190" y="241" width="114" height="25" rx="12" fill="#F5F4EF"/><text x="200" y="258" font-size="11" fill="#26614E" font-weight="600">人像淡彩</text><rect x="314" y="241" width="114" height="25" rx="12" fill="#F5F4EF"/><text x="324" y="258" font-size="11" fill="#26614E" font-weight="600">花鸟写意</text><text x="66" y="303" font-size="14" fill="#203B35" font-weight="600">描述你想画的内容</text><rect x="66" y="323" width="366" height="120" rx="8" fill="#F5F4EF"/><text x="80" y="354" font-size="15" fill="#203B35" font-weight="400">远山、江面与一叶小舟，</text><text x="80" y="382" font-size="15" fill="#203B35" font-weight="400">留白，淡墨，宣纸质感。</text><text x="66" y="482" font-size="14" fill="#203B35" font-weight="600">参考照片（可选）</text><rect x="66" y="500" width="366" height="94" rx="8" fill="#F5F4EF" stroke="#DCE2DB"/><text x="98" y="552" font-size="15" fill="#26614E" font-weight="400">＋ 上传参考图</text><text x="66" y="629" font-size="14" fill="#203B35" font-weight="400">生成 1 张 · 横向 3:2</text><text x="66" y="665" font-size="13" fill="#6C7772" font-weight="400">□ 我了解参考图的处理用途</text><rect x="66" y="696" width="366" height="38" rx="7" fill="#26614E"/><text x="80" y="721" font-size="13" fill="#FFFFFF" font-weight="600">获取本次点数报价</text><text x="66" y="760" font-size="13" fill="#6C7772" font-weight="400">确认费用后才创建生成任务。</text><rect x="66" y="796" width="366" height="96" rx="9" fill="#E9EEE7"/><text x="80" y="821" font-size="13" fill="#26614E" font-weight="700">结果与原片分开保存</text><text x="80" y="845" font-size="12" fill="#6C7772" font-weight="400">失败释放预占额度；状态未知先查询。</text><text x="80" y="867" font-size="12" fill="#6C7772" font-weight="400">生成图保留来源，会员不删除 AI 标识。</text><rect x="478" y="176" width="902" height="760" rx="10" fill="#FFFFFF"/><text x="500" y="216" font-size="21" fill="#203B35" font-weight="700">结果预览</text><rect x="1182" y="194" width="174" height="25" rx="12" fill="#E6EEE6"/><text x="1192" y="211" font-size="11" fill="#26614E" font-weight="600">效果示意 · AI 标识</text><rect x="500" y="245" width="858" height="470" rx="6" fill="#EEEADF"/><path d="M500 620 Q650 270 800 570 Q920 320 1050 530 Q1200 330 1358 580 L1358 715 L500 715Z" fill="#B8C4B6" opacity=".7"/><path d="M500 670 Q690 440 880 645 Q1110 390 1358 670 L1358 715 L500 715Z" fill="#7F9C8B" opacity=".5"/><path d="M500 690 Q900 635 1358 690" fill="none" stroke="#638570" stroke-width="3"/><path d="M1000 660 L1060 660 L1045 674 L1015 674Z" fill="#3C5749"/><text x="525" y="280" font-size="14" fill="#6C7772" font-weight="400">水墨留白 · 原创示意</text><text x="523" y="693" font-size="12" fill="#203B35" font-weight="400">AI 生成内容标识区域（最终按核验规范实现）</text><rect x="500" y="741" width="184" height="38" rx="7" fill="#FFFFFF" stroke="#DCE2DB"/><text x="514" y="766" font-size="13" fill="#203B35" font-weight="600">加入我的素材</text><rect x="704" y="741" width="184" height="38" rx="7" fill="#26614E"/><text x="718" y="766" font-size="13" fill="#FFFFFF" font-weight="600">插入当前相册</text><rect x="500" y="815" width="858" height="96" rx="9" fill="#E9EEE7"/><text x="514" y="840" font-size="13" fill="#26614E" font-weight="700">生成过程</text><text x="514" y="864" font-size="12" fill="#6C7772" font-weight="400">排队 → 生成中 → 审核 → 成功；超时先显示“确认处理中”。</text><text x="514" y="886" font-size="12" fill="#6C7772" font-weight="400">不承诺完全保留人像；不覆盖原片；失败、取消与迟到结果的点数只结算一次。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img"><title>P06 · 登录、会员与在线授权</title><desc>商业模式已确认；价格与配额尚未定价，此页只评审信息结构，不代表已上线售卖。</desc><style>text{font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif} .muted{fill:#6C7772}</style><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F5F4EF"/><text x="32" y="39" font-size="22" fill="#203B35" font-weight="700">P06 · 登录、会员与在线授权</text><text x="32" y="66" font-size="13" fill="#6C7772" font-weight="400">商业模式已确认；价格与配额尚未定价，此页只评审信息结构，不代表已上线售卖。</text><rect x="24" y="86" width="1392" height="64" rx="12" fill="#FFFFFF"/><text x="44" y="126" font-size="20" fill="#26614E" font-weight="700">拾光相册</text><text x="240" y="125" font-size="14" fill="#26614E" font-weight="600">我的相册</text><text x="390" y="125" font-size="14" fill="#6C7772" font-weight="400">模板中心</text><text x="540" y="125" font-size="14" fill="#6C7772" font-weight="400">AI 水墨彩绘</text><text x="690" y="125" font-size="14" fill="#6C7772" font-weight="400">任务中心</text><rect x="1160" y="105" width="88" height="25" rx="12" fill="#E6EEE6"/><text x="1170" y="122" font-size="11" fill="#26614E" font-weight="600">个人工作区</text><text x="1270" y="125" font-size="13" fill="#203B35" font-weight="400">账号与会员</text><rect x="44" y="176" width="1336" height="111" rx="10" fill="#FFFFFF"/><text x="66" y="215" font-size="23" fill="#203B35" font-weight="700">账号与会员</text><text x="66" y="249" font-size="14" fill="#6C7772" font-weight="400">微信扫码登录 / 手机验证 · 账号绑定后多端共享作品与权益</text><rect x="1166" y="210" width="188" height="38" rx="7" fill="#FFFFFF" stroke="#DCE2DB"/><text x="1180" y="235" font-size="13" fill="#203B35" font-weight="600">查看绑定状态</text><rect x="44" y="313" width="430" height="265" rx="10" fill="#FFFFFF"/><text x="66" y="353" font-size="24" fill="#203B35" font-weight="700">免费体验</text><text x="66" y="389" font-size="14" fill="#6C7772" font-weight="400">先做一本，感受成册</text><text x="66" y="427" font-size="14" fill="#203B35" font-weight="400">基础模板与体验导出</text><text x="66" y="467" font-size="13" fill="#6C7772" font-weight="400">定价与配额：评审后确定</text><rect x="66" y="505" width="386" height="38" rx="7" fill="#FFFFFF" stroke="#DCE2DB"/><text x="80" y="530" font-size="13" fill="#203B35" font-weight="600">了解当前权益</text><rect x="498" y="313" width="430" height="265" rx="10" fill="#FFFFFF" stroke="#26614E"/><text x="520" y="353" font-size="24" fill="#203B35" font-weight="700">个人会员</text><text x="520" y="389" font-size="14" fill="#6C7772" font-weight="400">为家庭与旅行留住回忆</text><text x="520" y="427" font-size="14" fill="#203B35" font-weight="400">高清导出 · 更多模板</text><text x="520" y="467" font-size="13" fill="#6C7772" font-weight="400">定价与配额：评审后确定</text><rect x="520" y="505" width="386" height="38" rx="7" fill="#26614E"/><text x="534" y="530" font-size="13" fill="#FFFFFF" font-weight="600">查看方案</text><rect x="952" y="313" width="430" height="265" rx="10" fill="#FFFFFF"/><text x="974" y="353" font-size="24" fill="#203B35" font-weight="700">影楼会员</text><text x="974" y="389" font-size="14" fill="#6C7772" font-weight="400">为专业相册交付设计</text><text x="974" y="427" font-size="14" fill="#203B35" font-weight="400">大项目 · 席位能力预留</text><text x="974" y="467" font-size="13" fill="#6C7772" font-weight="400">定价与配额：评审后确定</text><rect x="974" y="505" width="386" height="38" rx="7" fill="#FFFFFF" stroke="#DCE2DB"/><text x="988" y="530" font-size="13" fill="#203B35" font-weight="600">了解影楼方案</text><rect x="44" y="604" width="654" height="210" rx="10" fill="#FFFFFF"/><text x="66" y="646" font-size="21" fill="#203B35" font-weight="700">AI 点数</text><text x="66" y="682" font-size="14" fill="#6C7772" font-weight="400">可用、处理中额度与流水分别展示</text><text x="66" y="716" font-size="13" fill="#6C7772" font-weight="400">点数包与会员赠送来源可追溯，生成前显示报价。</text><rect x="66" y="745" width="178" height="38" rx="7" fill="#FFFFFF" stroke="#DCE2DB"/><text x="80" y="770" font-size="13" fill="#203B35" font-weight="600">查看点数方案</text><rect x="262" y="745" width="178" height="38" rx="7" fill="#FFFFFF" stroke="#DCE2DB"/><text x="276" y="770" font-size="13" fill="#203B35" font-weight="600">查看点数流水</text><rect x="724" y="604" width="654" height="210" rx="10" fill="#FFFFFF"/><text x="746" y="646" font-size="21" fill="#203B35" font-weight="700">兑换码</text><rect x="746" y="668" width="430" height="40" rx="6" fill="#F5F4EF" stroke="#DCE2DB"/><text x="760" y="694" font-size="14" fill="#6C7772" font-weight="400">输入兑换码</text><rect x="1190" y="668" width="162" height="38" rx="7" fill="#26614E"/><text x="1204" y="693" font-size="13" fill="#FFFFFF" font-weight="600">兑换</text><text x="746" y="748" font-size="13" fill="#203B35" font-weight="400">兑换到：当前个人工作区</text><text x="746" y="780" font-size="13" fill="#6C7772" font-weight="400">有影楼工作区时，先确认权益归属。</text><rect x="44" y="840" width="1334" height="96" rx="9" fill="#E9EEE7"/><text x="58" y="865" font-size="13" fill="#26614E" font-weight="700">付款与授权状态</text><text x="58" y="889" font-size="12" fill="#6C7772" font-weight="400">购买前展示有效期、权益、赠送点数、退款条件；首期不做自动续费。</text><text x="58" y="911" font-size="12" fill="#6C7772" font-weight="400">付款完成 → 服务端确认 → 权益生效；确认处理中有查单入口。到期后仍可查看与下载原片。</text></svg>
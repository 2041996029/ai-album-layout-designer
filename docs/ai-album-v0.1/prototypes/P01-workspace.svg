<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img"><title>P01 · 网页工作台</title><desc>入口按使用场景组织；同一相册可在网页与小程序继续编辑。所有作品与数值为演示。</desc><style>text{font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif} .muted{fill:#6C7772}</style><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F5F4EF"/><text x="32" y="39" font-size="22" fill="#203B35" font-weight="700">P01 · 网页工作台</text><text x="32" y="66" font-size="13" fill="#6C7772" font-weight="400">入口按使用场景组织；同一相册可在网页与小程序继续编辑。所有作品与数值为演示。</text><rect x="24" y="86" width="1392" height="64" rx="12" fill="#FFFFFF"/><text x="44" y="126" font-size="20" fill="#26614E" font-weight="700">拾光相册</text><text x="240" y="125" font-size="14" fill="#26614E" font-weight="600">我的相册</text><text x="390" y="125" font-size="14" fill="#6C7772" font-weight="400">模板中心</text><text x="540" y="125" font-size="14" fill="#6C7772" font-weight="400">AI 水墨彩绘</text><text x="690" y="125" font-size="14" fill="#6C7772" font-weight="400">任务中心</text><rect x="1160" y="105" width="88" height="25" rx="12" fill="#E6EEE6"/><text x="1170" y="122" font-size="11" fill="#26614E" font-weight="600">个人工作区</text><text x="1270" y="125" font-size="13" fill="#203B35" font-weight="400">账号与会员</text><text x="44" y="202" font-size="28" fill="#203B35" font-weight="700">把照片，变成值得翻阅的故事。</text><text x="44" y="233" font-size="15" fill="#6C7772" font-weight="400">从快速成册开始，也可以进入专业排版。</text><rect x="44" y="265" width="430" height="150" rx="10" fill="#FFFFFF"/><text x="66" y="305" font-size="21" fill="#203B35" font-weight="700">快速成册</text><text x="66" y="337" font-size="14" fill="#6C7772" font-weight="400">选照片、选风格，获得可修改草稿</text><rect x="66" y="356" width="160" height="38" rx="7" fill="#26614E"/><text x="80" y="381" font-size="13" fill="#FFFFFF" font-weight="600">开始成册</text><rect x="498" y="265" width="430" height="150" rx="10" fill="#FFFFFF"/><text x="520" y="305" font-size="21" fill="#203B35" font-weight="700">专业排版</text><text x="520" y="337" font-size="14" fill="#6C7772" font-weight="400">管理多跨页、图层与精细效果</text><rect x="520" y="356" width="160" height="38" rx="7" fill="#FFFFFF" stroke="#DCE2DB"/><text x="534" y="381" font-size="13" fill="#203B35" font-weight="600">新建空白相册</text><rect x="952" y="265" width="430" height="150" rx="10" fill="#FFFFFF"/><text x="974" y="305" font-size="21" fill="#203B35" font-weight="700">水墨彩绘</text><text x="974" y="337" font-size="14" fill="#6C7772" font-weight="400">让灵感成为可插入相册的素材</text><rect x="974" y="356" width="160" height="38" rx="7" fill="#FFFFFF" stroke="#DCE2DB"/><text x="988" y="381" font-size="13" fill="#203B35" font-weight="600">去 AI 创作</text><text x="44" y="467" font-size="21" fill="#203B35" font-weight="700">最近相册</text><rect x="1180" y="436" width="190" height="38" rx="7" fill="#26614E"/><text x="1194" y="461" font-size="13" fill="#FFFFFF" font-weight="600">＋ 新建相册</text><rect x="44" y="490" width="430" height="302" rx="10" fill="#FFFFFF"/><rect x="62" y="508" width="394" height="184" rx="2" fill="#FFFEFA" stroke="#DCE2DB"/><line x1="259.0" y1="508" x2="259.0" y2="692" stroke="#D8D4C8"/><rect x="77.76" y="522.72" width="161.54" height="147.20000000000002" rx="4" fill="#C9D8CC"/><path d="M79.76 667.9200000000001 L134.299 581.6 L177.9148 628.7040000000001 L206.99200000000002 596.32 L237.3 667.9200000000001 Z" fill="#A7BFAF"/><circle cx="198.91500000000002" cy="559.52" r="11.776000000000002" fill="#F5EEE0"/><text x="87.76" y="657.9200000000001" font-size="11" fill="#203B35" font-weight="400">主图</text><rect x="278.70000000000005" y="522.72" width="153.66" height="90.16" rx="4" fill="#C9D8CC"/><path d="M280.70000000000005 610.88 L332.48100000000005 558.784 L373.96920000000006 587.6352 L401.62800000000004 567.8000000000001 L430.36 610.88 Z" fill="#A7BFAF"/><circle cx="393.94500000000005" cy="545.26" r="7.2128" fill="#F5EEE0"/><text x="288.70000000000005" y="600.88" font-size="11" fill="#203B35" font-weight="400">细节</text><text x="286.58" y="647.84" font-size="10" fill="#203B35" font-weight="600">把日常，装进回忆</text><text x="64" y="727" font-size="17" fill="#203B35" font-weight="600">山海之间 · 旅行纪念</text><text x="64" y="756" font-size="12" fill="#6C7772" font-weight="400">20 内页 · 最近已保存 · 私有</text><rect x="498" y="490" width="430" height="302" rx="10" fill="#FFFFFF"/><rect x="516" y="508" width="394" height="184" rx="2" fill="#FFFEFA" stroke="#DCE2DB"/><line x1="713.0" y1="508" x2="713.0" y2="692" stroke="#D8D4C8"/><rect x="531.76" y="526.4" width="165.48" height="119.60000000000001" rx="4" fill="#C9D8CC"/><path d="M533.76 644.0 L589.678 574.24 L634.3576 612.512 L664.144 586.1999999999999 L695.24 644.0 Z" fill="#A7BFAF"/><circle cx="655.87" cy="556.3" r="9.568000000000001" fill="#F5EEE0"/><text x="541.76" y="634.0" font-size="11" fill="#203B35" font-weight="400">照片 01</text><rect x="728.76" y="526.4" width="165.48" height="119.60000000000001" rx="4" fill="#C9D8CC"/><path d="M730.76 644.0 L786.678 574.24 L831.3576 612.512 L861.144 586.1999999999999 L892.24 644.0 Z" fill="#A7BFAF"/><circle cx="852.87" cy="556.3" r="9.568000000000001" fill="#F5EEE0"/><text x="738.76" y="634.0" font-size="11" fill="#203B35" font-weight="400">照片 02</text><text x="551.46" y="669.92" font-size="10" fill="#203B35" font-weight="400">我们的美好时光</text><text x="518" y="727" font-size="17" fill="#203B35" font-weight="600">一岁一礼 · 亲子相册</text><text x="518" y="756" font-size="12" fill="#6C7772" font-weight="400">20 内页 · 最近已保存 · 私有</text><rect x="952" y="490" width="430" height="302" rx="10" fill="#FFFFFF"/><rect x="970" y="508" width="394" height="184" rx="2" fill="#FFFEFA" stroke="#DCE2DB"/><line x1="1167.0" y1="508" x2="1167.0" y2="692" stroke="#D8D4C8"/><rect x="985.76" y="537.44" width="110.32000000000001" height="101.2" rx="4" fill="#C9D8CC"/><path d="M987.76 636.6400000000001 L1024.372 577.9200000000001 L1054.1584 610.3040000000001 L1074.016 588.0400000000001 L1094.08 636.6400000000001 Z" fill="#A7BFAF"/><circle cx="1068.5" cy="562.74" r="8.096" fill="#F5EEE0"/><text x="995.76" y="626.6400000000001" font-size="11" fill="#203B35" font-weight="400">照片 1</text><rect x="1111.84" y="537.44" width="110.32000000000001" height="101.2" rx="4" fill="#C9D8CC"/><path d="M1113.84 636.6400000000001 L1150.452 577.9200000000001 L1180.2384 610.3040000000001 L1200.096 588.0400000000001 L1220.1599999999999 636.6400000000001 Z" fill="#A7BFAF"/><circle cx="1194.58" cy="562.74" r="8.096" fill="#F5EEE0"/><text x="1121.84" y="626.6400000000001" font-size="11" fill="#203B35" font-weight="400">照片 2</text><rect x="1237.92" y="537.44" width="110.32000000000001" height="101.2" rx="4" fill="#C9D8CC"/><path d="M1239.92 636.6400000000001 L1276.5320000000002 577.9200000000001 L1306.3184 610.3040000000001 L1326.1760000000002 588.0400000000001 L1346.24 636.6400000000001 Z" fill="#A7BFAF"/><circle cx="1320.66" cy="562.74" r="8.096" fill="#F5EEE0"/><text x="1247.92" y="626.6400000000001" font-size="11" fill="#203B35" font-weight="400">照片 3</text><text x="1001.52" y="666.24" font-size="10" fill="#203B35" font-weight="400">一起走过的四季</text><text x="972" y="727" font-size="17" fill="#203B35" font-weight="600">光影写真 · 客户项目</text><text x="972" y="756" font-size="12" fill="#6C7772" font-weight="400">20 内页 · 最近已保存 · 私有</text><rect x="44" y="829" width="654" height="96" rx="9" fill="#E9EEE7"/><text x="58" y="854" font-size="13" fill="#26614E" font-weight="700">首次使用与空态</text><text x="58" y="878" font-size="12" fill="#6C7772" font-weight="400">没有作品时显示示例和“从手机选照片”；上传失败可逐项重试。</text><text x="58" y="900" font-size="12" fill="#6C7772" font-weight="400">个人与影楼工作区明确切换，作品、订单和权益不隐式迁移。</text><rect x="724" y="829" width="654" height="96" rx="9" fill="#E9EEE7"/><text x="738" y="854" font-size="13" fill="#26614E" font-weight="700">跨端继续</text><text x="738" y="878" font-size="12" fill="#6C7772" font-weight="400">小程序上传和轻编辑；网页进行完整图层编辑。</text><text x="738" y="900" font-size="12" fill="#6C7772" font-weight="400">存储超额限制新增，不隐藏或立即删除已有作品。</text></svg>
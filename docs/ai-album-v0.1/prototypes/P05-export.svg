<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img"><title>P05 · 导出预检与任务队列</title><desc>提交时冻结已保存的作品版本；继续编辑不会改变本次导出。状态与任务数为演示。</desc><style>text{font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif} .muted{fill:#6C7772}</style><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F5F4EF"/><text x="32" y="39" font-size="22" fill="#203B35" font-weight="700">P05 · 导出预检与任务队列</text><text x="32" y="66" font-size="13" fill="#6C7772" font-weight="400">提交时冻结已保存的作品版本；继续编辑不会改变本次导出。状态与任务数为演示。</text><rect x="24" y="86" width="1392" height="64" rx="12" fill="#FFFFFF"/><text x="44" y="126" font-size="20" fill="#26614E" font-weight="700">拾光相册</text><text x="240" y="125" font-size="14" fill="#6C7772" font-weight="400">我的相册</text><text x="390" y="125" font-size="14" fill="#6C7772" font-weight="400">模板中心</text><text x="540" y="125" font-size="14" fill="#6C7772" font-weight="400">AI 水墨彩绘</text><text x="690" y="125" font-size="14" fill="#26614E" font-weight="600">任务中心</text><rect x="1160" y="105" width="88" height="25" rx="12" fill="#E6EEE6"/><text x="1170" y="122" font-size="11" fill="#26614E" font-weight="600">个人工作区</text><text x="1270" y="125" font-size="13" fill="#203B35" font-weight="400">账号与会员</text><rect x="44" y="176" width="450" height="770" rx="10" fill="#FFFFFF"/><text x="66" y="217" font-size="22" fill="#203B35" font-weight="700">导出设置与预检</text><text x="66" y="260" font-size="12" fill="#6C7772" font-weight="400">格式</text><rect x="64" y="271" width="408" height="39" rx="6" fill="#F5F4EF"/><text x="78" y="297" font-size="13" fill="#203B35" font-weight="400">高清 JPG / PNG / 普通 PDF</text><text x="66" y="332" font-size="12" fill="#6C7772" font-weight="400">页序</text><rect x="64" y="343" width="408" height="39" rx="6" fill="#F5F4EF"/><text x="78" y="369" font-size="13" fill="#203B35" font-weight="400">全部 20 内页 · 封面单独</text><text x="66" y="404" font-size="12" fill="#6C7772" font-weight="400">尺寸与分辨率</text><rect x="64" y="415" width="408" height="39" rx="6" fill="#F5F4EF"/><text x="78" y="441" font-size="13" fill="#203B35" font-weight="400">300 × 300 mm · 300 DPI</text><text x="66" y="476" font-size="12" fill="#6C7772" font-weight="400">排版视图</text><rect x="64" y="487" width="408" height="39" rx="6" fill="#F5F4EF"/><text x="78" y="513" font-size="13" fill="#203B35" font-weight="400">单页 / 跨页</text><text x="66" y="548" font-size="12" fill="#6C7772" font-weight="400">出血</text><rect x="64" y="559" width="408" height="39" rx="6" fill="#F5F4EF"/><text x="78" y="585" font-size="13" fill="#203B35" font-weight="400">3 mm · 安全区 5 mm</text><rect x="66" y="631" width="406" height="123" rx="8" fill="#FBF0DB"/><text x="82" y="659" font-size="15" fill="#8D6423" font-weight="600">!  2 张照片清晰度偏低</text><text x="82" y="688" font-size="12" fill="#8D6423" font-weight="400">第 4、7 跨页，建议替换更高清原片。</text><text x="82" y="724" font-size="13" fill="#203B35" font-weight="400">□ 我了解警告并继续导出</text><text x="66" y="790" font-size="12" fill="#6C7772" font-weight="400">缺图／缺字体／超资源预算将阻断导出。</text><rect x="66" y="815" width="406" height="38" rx="7" fill="#26614E"/><text x="80" y="840" font-size="13" fill="#FFFFFF" font-weight="600">确认并加入导出队列</text><text x="66" y="893" font-size="12" fill="#6C7772" font-weight="400">普通 sRGB PDF；专业印刷功能后续扩展。</text><text x="526" y="217" font-size="23" fill="#203B35" font-weight="700">我的导出任务</text><text x="526" y="249" font-size="14" fill="#6C7772" font-weight="400">页面关闭后仍可在网页或小程序查看。</text><rect x="526" y="283" width="854" height="166" rx="10" fill="#FFFFFF"/><text x="548" y="317" font-size="18" fill="#203B35" font-weight="600">山海之间 · 作品版本 12</text><rect x="1180" y="298" width="174" height="25" rx="12" fill="#E6EEE6"/><text x="1190" y="315" font-size="11" fill="#26614E" font-weight="600">处理中 65%</text><text x="548" y="355" font-size="14" fill="#6C7772" font-weight="400">正在渲染第 7 / 10 跨页</text><text x="548" y="384" font-size="11" fill="#6C7772" font-weight="400">任务编号 EXP-DEMO-001</text><rect x="1180" y="391" width="174" height="38" rx="7" fill="#FFFFFF" stroke="#DCE2DB"/><text x="1194" y="416" font-size="13" fill="#203B35" font-weight="600">取消</text><rect x="526" y="467" width="854" height="166" rx="10" fill="#FFFFFF"/><text x="548" y="501" font-size="18" fill="#203B35" font-weight="600">亲子纪念 · 作品版本 8</text><rect x="1180" y="482" width="174" height="25" rx="12" fill="#E6EEE6"/><text x="1190" y="499" font-size="11" fill="#26614E" font-weight="600">已完成</text><text x="548" y="539" font-size="14" fill="#6C7772" font-weight="400">20 内页 · 下载有效期显示在此</text><text x="548" y="568" font-size="11" fill="#6C7772" font-weight="400">任务编号 EXP-DEMO-002</text><rect x="1180" y="575" width="174" height="38" rx="7" fill="#26614E"/><text x="1194" y="600" font-size="13" fill="#FFFFFF" font-weight="600">下载文件</text><rect x="526" y="651" width="854" height="166" rx="10" fill="#FFFFFF"/><text x="548" y="685" font-size="18" fill="#203B35" font-weight="600">光影写真 · 作品版本 4</text><rect x="1180" y="666" width="174" height="25" rx="12" fill="#FAE5DD"/><text x="1190" y="683" font-size="11" fill="#26614E" font-weight="600">失败</text><text x="548" y="723" font-size="14" fill="#6C7772" font-weight="400">字体暂不可用；请恢复字体后重试</text><text x="548" y="752" font-size="11" fill="#6C7772" font-weight="400">任务编号 EXP-DEMO-003</text><rect x="1180" y="759" width="174" height="38" rx="7" fill="#FFFFFF" stroke="#DCE2DB"/><text x="1194" y="784" font-size="13" fill="#203B35" font-weight="600">查看并重试</text><rect x="526" y="852" width="854" height="96" rx="9" fill="#E9EEE7"/><text x="540" y="877" font-size="13" fill="#26614E" font-weight="700">快照、过期与重试</text><text x="540" y="901" font-size="12" fill="#6C7772" font-weight="400">已提交任务按提交时权益执行，会员在排队期间到期不影响它完成。</text><text x="540" y="923" font-size="12" fill="#6C7772" font-weight="400">下载链接过期可重新鉴权；产物到期后需新建导出任务，不保证永久缓存。</text></svg>